<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Default document title (a11y: every page needs a title). Routes may
             override via <svelte:head><title>…</title>. -->
        <title>sensei</title>
        %sveltekit.head%
    </head>
    <body
        data-sveltekit-preload-data="hover"
        data-style="zen-sumi"
        data-density="comfortable"
    >
        <script>
            // Resolve the theme mode before first paint. A STORED manual choice
            // (localStorage "sensei".mode = "light"|"dark") wins; otherwise follow
            // the OS. (Previously the OS preference unconditionally overrode the
            // stored choice, so a manual selection could never stick — and it left
            // no deterministic way to render a chosen mode.) data-mode is written on
            // BOTH <html> and <body> so the token cascade is unambiguous.
            (function () {
                var stored;
                try { stored = (JSON.parse(localStorage.getItem("sensei") || "{}") || {}).mode; } catch (e) {}
                var mode = (stored === "light" || stored === "dark")
                    ? stored
                    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.dataset.mode = mode;
                document.body.dataset.mode = mode;
            })();
        </script>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
