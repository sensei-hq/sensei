name: Release

on:
  push:
    tags:
      - "v*"

# Least-privilege default: read-only. Only the `release` job (which creates the
# GitHub Release and uploads assets) elevates to `contents: write`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Daemon binaries (4 platforms) ──────────────────────────────────────────
  build-daemon:
    strategy:
      # NOT fail-fast. `release` needs every leg of this matrix, so a single
      # broken target blocks the release either way — but with fail-fast the
      # other three legs are CANCELLED, and a cancelled leg reports nothing.
      # On v0.10.0 that meant one failing target (aarch64-linux) hid the state
      # of the other three, so each attempt could only ever reveal one problem
      # and each round of finding out costs a version tag. Let them all finish
      # and report.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: sensei-macos-arm64
            embedded: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: sensei-macos-x86_64
            embedded: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sensei-linux-x86_64
            embedded: true
          # aarch64-linux builds NATIVELY on a GitHub-hosted ARM runner. It
          # used to cross-compile in `cross`'s Docker image, and that failed on
          # v0.10.0: `pg_query`'s build script runs bindgen, and the clang in
          # that image could not find its own `stdbool.h`, so the whole release
          # produced no artifacts at all. A native runner has a working
          # toolchain and apt, which removes the entire class of
          # target-C-headers-missing failure rather than patching one instance
          # of it. `pg_query` reaches us through `dbd-core`, so this is not
          # optional — the schema library brings a real PostgreSQL parser with
          # it.
          #
          # Still `embedded: false`, deliberately: the reason to want a native
          # runner here was #78, but flipping llama.cpp on in the same change
          # that fixes a broken release would mean two variables at once. #78
          # is now a one-line change (`embedded: true`).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: sensei-linux-arm64
            embedded: false

    runs-on: ${{ matrix.os }}
    # Fail fast if a runner type ever goes silent again — v0.2.15 sat 24h
    # on macos-13 waiting for a runner. Healthy daemon builds finish in ~10m.
    # Embedded llama.cpp adds ~5m to the compile step (native C++), so bumped
    # to 45m.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to the action's master commit (zizmor unpinned-uses); the
        # toolchain is selected via the explicit `toolchain:` input instead of
        # the @stable ref, so the Rust channel is NOT frozen to a version.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Embedded llama.cpp compiles native C++ via cmake — macOS has clang
      # from the Xcode CLT preinstalled; the Ubuntu runners don't ship cmake.
      - name: Install cmake (Linux, embedded builds only)
        if: matrix.embedded && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      # Every target now builds natively on a runner of its own architecture,
      # so there is one build command rather than a cross/cargo branch. The
      # `cross` install and the `if` around it went with the last
      # cross-compiled target; re-add both together if one ever comes back.
      - name: Build binaries
        env:
          BUILD_TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.embedded && '--features senseid/embedded-llama-cpp' || '' }}
        run: cargo build --release --target "$BUILD_TARGET" -p senseid -p sensei-cli -p sensei-mcp $FEATURES

      - name: Package binaries
        env:
          BUILD_TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p "$ARTIFACT"
          for bin in senseid sensei sensei-mcp; do
            src="target/${BUILD_TARGET}/release/${bin}"
            [ -f "$src" ] && cp "$src" "$ARTIFACT/"
          done
          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ── Desktop app (macOS universal) ──────────────────────────────────────────
  build-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # no-cache: releases run once per tag, so the cache offers little; more
      # importantly it removes the cache-poisoning vector zizmor flags on a
      # release trigger (a cache poisoned on a PR must not reach the release).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true

      - name: Install Rust stable
        # Pinned to the action's master commit (zizmor unpinned-uses); the
        # toolchain is selected via the explicit `toolchain:` input instead of
        # the @stable ref, so the Rust channel is NOT frozen to a version.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: app
        run: bun install

      - name: Build app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target universal-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sensei-app-dmg
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ── GitHub Release (all artifacts) ─────────────────────────────────────────
  release:
    needs: [build-daemon, build-app]
    runs-on: ubuntu-latest
    # Elevated above the read-only top-level default: this job creates the
    # GitHub Release and uploads assets via softprops/action-gh-release.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg

  # ── Publish gateway to crates.io (independent) ────────────────────────────
  # TODO: uncomment when CARGO_REGISTRY_TOKEN secret is configured
  # publish-gateway:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
  #     - uses: dtolnay/rust-toolchain@stable
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         workspaces: crates/gateway
  #     - name: Run tests
  #       working-directory: crates/gateway
  #       run: cargo test --all-features
  #     - name: Publish to crates.io
  #       working-directory: crates/gateway
  #       run: cargo publish -p gateway
  #       env:
  #         CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Update Homebrew tap ────────────────────────────────────────────────────
  # SOLE WRITER OF THE TAP'S FORMULA AND CASK.
  #
  # `make bump` used to push the monorepo's `homebrew/` templates to the tap and
  # rely on this job to fill their checksums minutes later. That is fail-OPEN: when
  # `TAP_GITHUB_TOKEN` expired, the repair stopped and the tap was left advertising
  # a version whose every checksum was the literal `REPLACE_WITH_*_SHA256`, with
  # the last good formula already overwritten. `brew install` could not work for
  # ~8 releases (v0.7.3 … v0.10.0) and nothing surfaced it.
  #
  # Now the monorepo holds the TEMPLATE and this job renders it. A failure anywhere
  # — expired token, missing asset, bad checksum — leaves the tap at the previous
  # release, which is still installable. `make bump` no longer touches the tap.
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # FIRST, and it must stay first: `actions/checkout` cleans its target
      # directory, so checking the monorepo out after the asset downloads below
      # would delete the tarballs whose checksums we just computed.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Derive version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download CLI tarballs and compute SHA256s
        run: |
          # `gh release download` rather than `curl`, which authenticates via
          # GH_TOKEN (set at the job level). The original reason — "the repo is
          # private so a bare curl 404s" — is STALE: sensei-hq/sensei is public
          # now, and the unauthenticated releases/download URL serves the same
          # bytes (verified by re-fetching and re-hashing). Keeping `gh` anyway:
          # it is rate-limited as an authenticated caller, and the formula's own
          # URLs are the public ones either way, so nothing here depends on the
          # repo's visibility.
          for artifact in sensei-macos-arm64 sensei-macos-x86_64 sensei-linux-arm64 sensei-linux-x86_64; do
            gh release download "${TAG}" --repo sensei-hq/sensei \
              -p "${artifact}.tar.gz" -O "${artifact}.tar.gz" --clobber
            sha=$(sha256sum "${artifact}.tar.gz" | cut -d' ' -f1)
            key="SHA256_${artifact//-/_}"
            echo "${key}=${sha}" >> "$GITHUB_ENV"
          done

      - name: Find DMG asset and compute SHA256
        run: |
          dmg_name=$(gh release view "${TAG}" --repo sensei-hq/sensei \
            --json assets --jq '.assets[] | select(.name | endswith(".dmg")) | .name' \
            | head -1)
          # No `DMG_FOUND` flag: an UNSET `SHA256_dmg` is the signal, and the
          # renderer reads it as "leave the tap's cask alone" rather than
          # "publish a cask with no checksum". One piece of state instead of two
          # that can disagree.
          if [ -n "$dmg_name" ]; then
            gh release download "${TAG}" --repo sensei-hq/sensei \
              -p "$dmg_name" -O "$dmg_name" --clobber
            sha=$(sha256sum "$dmg_name" | cut -d' ' -f1)
            echo "SHA256_dmg=${sha}" >> "$GITHUB_ENV"
          else
            echo "No DMG in release — the cask stays at its current version"
          fi

      - name: Checkout homebrew-tap
        # zizmor: ignore[artipacked] TAP_GITHUB_TOKEN is intentionally persisted —
        # the formula commit/push step below pushes to the tap repo using it.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: sensei-hq/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      # Renders BOTH files from the monorepo templates and verifies the result
      # before it can be committed: every url must carry the checksum belonging to
      # the artifact it names, and no placeholder may survive. See the script's
      # header for the two defects this replaced — chiefly that the previous
      # `awk` chose checksums POSITIONALLY, by tracking `if`/`elsif`/`else` lines,
      # so a reordered platform block would have written a valid-looking checksum
      # for the wrong artifact. That fails as a MISMATCH on a user's machine,
      # which reads like a tampered download.
      #
      # Checksums go through the environment, not argv, so they never reach `ps`.
      - name: Render formula and cask into the tap
        env:
          SHA_MACOS_ARM64: ${{ env.SHA256_sensei_macos_arm64 }}
          SHA_MACOS_X86_64: ${{ env.SHA256_sensei_macos_x86_64 }}
          SHA_LINUX_ARM64: ${{ env.SHA256_sensei_linux_arm64 }}
          SHA_LINUX_X86_64: ${{ env.SHA256_sensei_linux_x86_64 }}
          # Empty when the release carries no DMG, which the script treats as
          # "leave the cask alone" rather than "publish a cask with no checksum".
          SHA_DMG: ${{ env.SHA256_dmg }}
        run: python3 scripts/render-homebrew-tap.py tap "$VERSION"

      - name: Sweep legacy dev artefacts from tap
        # The dev/prod split has been removed (commits 4f269126 onward).
        # Tap still has sensei-dev.rb + the legacy Brewfiles from earlier
        # syncs. `git rm -f` is a no-op (exit 0) when the path is already
        # gone, so this step is safe to keep on every release.
        run: |
          cd tap
          git rm -f --ignore-unmatch Formula/sensei-dev.rb Brewfile Brewfile-dev || true

      - name: Commit and push
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Formula Casks
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update to v${VERSION}"
            git push
          fi

  # ── Deploy the dōjō schema ─────────────────────────────────────────────────
  #
  # dōjō is a Supabase project with no service of its own, so nothing else ever
  # applies its schema. Before this job it was a manual `dbd deploy` someone had
  # to remember after every release — which is how the relay tables silently fell
  # out of the Realtime publication and how two functions went missing entirely.
  #
  # Independent of `release` on purpose: the daemon deploys its OWN schema locally
  # at install time, so a dōjō outage must not block binaries from shipping. This
  # job fails loudly on its own instead.
  deploy-dojo:
    needs: release
    runs-on: ubuntu-latest
    # Gate this behind a protected environment to require a manual approval before
    # anything touches the production database. Configure reviewers under
    # Settings → Environments → dojo-prod.
    environment: dojo-prod
    env:
      DATABASE_URL: ${{ secrets.DOJO_DATABASE_URL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Refuse to run without a target
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DOJO_DATABASE_URL is not set — refusing to 'succeed' without deploying anything"
            exit 1
          fi

      # Pinned to the action's master commit like every other use of it in this
      # file — this one instance was left floating on `@stable`, which a tag
      # owner can silently repoint. The Rust channel is still chosen by the
      # explicit `toolchain:` input, so pinning the action does not freeze the
      # compiler version.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install dbd
        # Pinned to a tag, like every other dependency. dbd's own schema handling
        # changes between versions, so a floating install would mean the release
        # that deploys prod is not the one anybody tested against.
        #
        # The package is `dbd-cli` (the binary it installs is `dbd`). Keep this in
        # step with the dbd-core tag in crates/bootstrap/Cargo.toml — the daemon
        # embeds the same library to deploy its own schema, and a skew means the
        # CLI accepts DDL the daemon cannot parse.
        #
        # That invariant was VIOLATED by this very line until #197: it pinned
        # v0.12.0 against bootstrap's v0.14.0, and this is the pin that deploys
        # the dōjō's production schema. Now v0.19.0, matching both `dbd-core`
        # pins and `rust.yml`.
        run: cargo install --locked --git https://github.com/sensei-hq/dbd --tag v0.19.0 dbd-cli

      - name: Fail on any unparseable DDL
        # THE critical guard, and still required at 0.19.0. dbd drops a file it
        # cannot parse from the entity set SILENTLY and still reports success —
        # that is how dojo.set_pack_adoption and dojo.can_read_repository_metric
        # were never created on any database. 0.12.0 fixed the specific parse
        # failures we hit, but `dbd inspect` STILL EXITS 0 when a file fails to
        # parse (re-verified), so the exit code cannot be trusted; grep the output
        # and fail explicitly.
        working-directory: database
        run: |
          dbd inspect 2>&1 | tee inspect.log
          if grep -q "Parse error" inspect.log; then
            echo "::error::DDL failed to parse — those entities would be skipped silently"
            exit 1
          fi

      - name: Plan (audit trail)
        # Printed before anything is applied, so the job log records what this
        # release changed in production. Never fails the build: a fresh or drifted
        # database legitimately shows differences here.
        working-directory: database
        run: dbd diff --scope dojo || true

      - name: Apply schema changes
        # Which tool applies a change depends on whether the project is RELEASED,
        # so this branches rather than needing a manual edit at the cutover.
        #
        # Pre-release (today): `reconcile`. Verified that `dbd deploy` against an
        # existing database reports "N entities applied" and does NOT apply column
        # changes — a deploy-only job would report success on every release while
        # applying nothing.
        #
        # Post-release (after `dbd release` is run once): `reconcile` is DISABLED
        # and errors out. Changes travel as the snapshot `make bump` committed,
        # and the deploy step below migrates v(n) → v(n+1) from it. Verified:
        # snapshot then deploy reports "Migrated v1 → v2 — 1 migrated" and the
        # change lands; deploy WITHOUT the snapshot applies nothing.
        #
        # Either way: no --allow-destructive and no --prune. Automation gets the
        # safe subset; a drop or a rename stays a deliberate manual act.
        working-directory: database
        run: |
          if grep -qE '^[[:space:]]*released:[[:space:]]*true' design.yaml; then
            echo "Project is released — the deploy step migrates from the committed snapshot."
            dbd migrate --status
          else
            dbd reconcile --scope dojo
          fi

      - name: Apply seed data, policies and after-scripts
        # Pre-release, reconcile handled the schema and this runs the import phase
        # (seed datafiles), the RLS policy files, and the after-script that keeps
        # the relay tables in the Realtime publication.
        #
        # Post-release this ALSO performs the migration, from the snapshot in the
        # tag. Idempotent either way — every import is modified_at-guarded, so an
        # in-place edit in prod is not clobbered.
        working-directory: database
        run: dbd deploy --scope dojo

      - name: Verify the database matches the design
        # The proof the job actually did something. `--exit-code` returns 2 when
        # differences remain, 0 when in sync. Without this the job is only
        # asserting that dbd ran, not that the schema landed.
        #
        # This is also what catches the post-release footgun: a release whose DDL
        # changed but whose snapshot was never taken deploys NOTHING while
        # reporting success. The diff then still shows the change and this fails.
        working-directory: database
        run: dbd diff --scope dojo --exit-code
