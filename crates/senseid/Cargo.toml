[package]
name = "senseid"
version = "0.2.43"
edition = "2024"
description = "Sensei indexer daemon — graph-based code intelligence"

[features]
# Opt-in in-process inference adapters from gateway-embedded. Each one
# enables heavyweight native deps (ORT runtime for fastembed, C++ for
# llama.cpp). Off by default — the daemon ships only HTTP adapters
# unless one of these is enabled at build time.
embedded-fastembed = ["gateway-embedded/fastembed"]
embedded-llama-cpp = ["gateway-embedded/llama-cpp"]
embedded-ort = ["gateway-embedded/ort"]

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# PostgreSQL
sqlx-core = { version = "0.8", features = ["_rt-tokio", "chrono", "uuid", "json"] }
sqlx-postgres = { version = "0.8", features = ["chrono", "uuid", "json"] }

# Tree-sitter (for Python, Rust, Java)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"

# Regex
regex = "1"

# OXC for TypeScript/JavaScript (native Rust parser, no tree-sitter ABI issues)
oxc_parser = "0.124"
oxc_ast = "0.124"
oxc_span = "0.124"
oxc_allocator = "0.124"

# SQL parsing
sqlparser = { version = "0.57", features = ["visitor"] }

# Zed transcript adapter: read its threads.db (SQLite) + zstd-compressed thread blobs.
# `bundled` compiles SQLite from source (no system-sqlite linkage risk); ruzstd is
# a pure-Rust zstd decompressor (no C toolchain).
rusqlite = { version = "0.32", features = ["bundled"] }
ruzstd = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
toml = "0.8"
serde_yaml = "0.9"
# XML parsing — pom.xml (Maven, #86) and .csproj / .fsproj (.NET, #88).
# Streaming reader; no allocation on the parse tree, just the tokens we care
# about. Chosen over serde-based XML crates because pom.xml uses same-name
# repeated child elements that trip serde's typed deserializers.
quick-xml = "0.36"

# File watching
notify = "8"
notify-debouncer-mini = "0.6"
notify-rust = "4"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
globset = "0.4"
walkdir = "2"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
gateway = { git = "https://github.com/sensei-hq/gateway.git", rev = "01d0ab2" }
# Registry + trait types only by default — engine adapters land via the
# `embedded-*` cargo features above.
gateway-embedded = { git = "https://github.com/sensei-hq/gateway.git", rev = "01d0ab2" }
hive-protocol = { path = "../hive-protocol" }
dojo-protocol = { path = "../dojo-protocol" }
sensei-bootstrap = { path = "../bootstrap" }
sensei-config = { path = "../sensei-config" }
sensei-logger = { path = "../logger" }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
hive-mind = { path = "../hive-mind" }
# Contract test only — cross the MCP↔daemon seam by shaping requests with the
# real proxy code and issuing them against the in-process router. senseid has no
# runtime dependency on mcp, so this stays acyclic.
sensei-mcp = { path = "../mcp" }
