[package]
name = "senseid"
version = "0.6.4"
edition = "2024"
description = "Sensei indexer daemon — graph-based code intelligence"

[features]
# Opt-in in-process inference adapters (from sensei-local-providers, coldbooted
# by sensei-local-engine). Each enables heavyweight native deps (ORT runtime for
# fastembed / ort, C++ for llama.cpp). Off by default — the daemon ships only
# HTTP adapters unless one of these is enabled at build time. `local-engine/<fmt>`
# also enables the matching `local-providers/<fmt>`; both are listed so the
# optional `local-providers` dep is unambiguously pulled in either way.
embedded-fastembed = ["local-engine/fastembed", "local-providers/fastembed"]
embedded-llama-cpp = ["local-engine/llama-cpp", "local-providers/llama-cpp"]
embedded-ort = ["local-engine/ort", "local-providers/ort"]

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# PostgreSQL
sqlx-core = { version = "0.8", features = ["_rt-tokio", "chrono", "uuid", "json"] }
sqlx-postgres = { version = "0.8", features = ["chrono", "uuid", "json"] }

# Tree-sitter (for Python, Rust, Java)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"

# Regex
regex = "1"
semver = "1"

# OXC for TypeScript/JavaScript (native Rust parser, no tree-sitter ABI issues)
oxc_parser = "0.124"
oxc_ast = "0.124"
oxc_ast_visit = "0.124"
oxc_span = "0.124"
oxc_allocator = "0.124"

# SQL parsing
sqlparser = { version = "0.57", features = ["visitor"] }

# Zed transcript adapter: read its threads.db (SQLite) + zstd-compressed thread blobs.
# `bundled` compiles SQLite from source (no system-sqlite linkage risk); ruzstd is
# a pure-Rust zstd decompressor (no C toolchain).
rusqlite = { version = "0.32", features = ["bundled"] }
ruzstd = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
toml = "0.8"
serde_yaml = "0.9"
# XML parsing — pom.xml (Maven, #86) and .csproj / .fsproj (.NET, #88).
# Streaming reader; no allocation on the parse tree, just the tokens we care
# about. Chosen over serde-based XML crates because pom.xml uses same-name
# repeated child elements that trip serde's typed deserializers.
quick-xml = "0.36"

# File watching
notify = "8"
notify-debouncer-mini = "0.6"
notify-rust = "4"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
globset = "0.4"
walkdir = "2"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# Implementing the gateway's `kernel::ReadinessProbe` (an async trait) for the
# sensei-owned ModelProvisioning service. Same version the gateway kernel uses.
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
# v0.4.0 split the old gateway/gateway-embedded monolith five ways. sensei
# consumes three of them; shared model/type vocabulary lives in sensei-kernel,
# re-exported through these, so we don't depend on kernel directly.
# Routing engine + cloud provider adapters (behind the default `cloud` feature).
gateway = { package = "sensei-gateway", git = "https://github.com/sensei-hq/gateway.git", tag = "v0.4.6", features = ["cloud"] }
# Local model engine: id→bytes resolvers (managed / ollama / external / chained),
# used by both model_provision (the sensei-owned Ollama-registry puller) and the
# ModelProvisioning service's readiness/registration wiring. Always present; the
# heavy in-process adapter backends land only via the embedded-* features.
#
# NOTE: the `hf-download` feature (hf-hub puller) is intentionally NOT enabled:
# on-demand provisioning downloads via the Ollama registry (crate::model_provision),
# which is not Xet-affected. HF-as-a-source returns once gateway#5 (hf-hub Xet
# stall) is resolved.
local-engine = { package = "sensei-local-engine", git = "https://github.com/sensei-hq/gateway.git", tag = "v0.4.6" }
# In-process inference adapters (llama.cpp / fastembed / ort). Optional — pulled
# in (with its heavy native backend) only when an embedded-* feature is enabled.
local-providers = { package = "sensei-local-providers", git = "https://github.com/sensei-hq/gateway.git", tag = "v0.4.6", optional = true }
dojo-protocol = { path = "../dojo-protocol" }
# Relay P5.2 — ACP (Agent Client Protocol) observe-first. The spec's official
# Rust SDK (Apache-2.0, Zed-maintained). We use only its `schema::v1` wire types
# (SessionNotification / SessionUpdate / Plan / ToolCall — pure serde) for the
# observe→segment mapping; the live client connection loop is P5.2b. Pinned to a
# release ≥7 days old (1.2.0 published 2026-07-07). Default features only — no
# `unstable_*` features enabled.
agent-client-protocol = "=1.2.0"
sensei-bootstrap = { path = "../bootstrap" }
sensei-config = { path = "../sensei-config" }
sensei-logger = { path = "../logger" }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
# Contract test only — cross the MCP↔daemon seam by shaping requests with the
# real proxy code and issuing them against the in-process router. senseid has no
# runtime dependency on mcp, so this stays acyclic.
sensei-mcp = { path = "../mcp" }
