fragment Board on ProjectV2 {
  id
  title
  url
  number
  closed
  owner {
    __typename
    ... on Organization { login }
    ... on User { login }
  }
  fields(first: 100) {
    pageInfo { hasNextPage }
    nodes {
      __typename
      ... on ProjectV2IterationField {
        id
        name
        configuration {
          iterations { id title startDate duration }
          completedIterations { id title startDate duration }
        }
      }
    }
  }
}
