[package]
name = "sensei-cli"
version = "0.22.0"
edition = "2024"
description = "Sensei CLI — initialize and manage sensei for AI coding"

[[bin]]
name = "sensei"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sensei-bootstrap = { workspace = true }
tracing = { workspace = true }
owo-colors = { version = "4", features = ["supports-colors"] }

[dev-dependencies]
tempfile = { workspace = true }
