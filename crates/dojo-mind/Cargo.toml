[package]
name = "dojo-mind"
version = "0.2.17"
edition = "2024"
description = "sensei-dojo — the org shared-brain federation service"
license = "MIT"

[[bin]]
name = "sensei-dojo"
path = "src/main.rs"

[dependencies]
dojo-protocol = { path = "../dojo-protocol" }
dbd-core = { git = "https://github.com/sensei-hq/dbd", tag = "v0.8.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
postgresql_embedded = { version = "0.18", features = ["tokio"] }
sqlx-core = { version = "0.8", features = ["_rt-tokio", "chrono", "uuid", "json"] }
sqlx-postgres = { version = "0.8", features = ["chrono", "uuid", "json"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
subtle = "2"
axum = "0.8"
jsonwebtoken = "9"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
