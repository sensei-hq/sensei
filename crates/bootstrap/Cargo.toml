[package]
name = "sensei-bootstrap"
version = "0.8.1"
edition = "2024"
description = "Prerequisite detection, installation, and hardware profiling for sensei"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.34"
tokio = { version = "1", features = ["process", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dbd-core = { git = "https://github.com/sensei-hq/dbd", tag = "v0.10.7" }
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
