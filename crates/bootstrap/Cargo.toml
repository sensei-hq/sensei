[package]
name = "sensei-bootstrap"
version = "0.21.1"
edition = "2024"
description = "Prerequisite detection, installation, and hardware profiling for sensei"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.34"
tokio = { workspace = true, features = ["process", "time", "rt"] }
reqwest = { workspace = true, features = ["blocking"] }
dbd-core = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "registry"] }
tracing-appender = "0.2.5"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
