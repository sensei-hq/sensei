[package]
name = "sensei-logger"
version = "0.21.1"
edition = "2024"
description = "Structured logger — kavach pattern (level, running_on, context, data, error)"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

# Writers (optional features for consumers that need them)
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
default = ["pg", "api"]
pg = ["sqlx-core", "sqlx-postgres"]
api = ["reqwest"]
