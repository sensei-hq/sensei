[package]
name = "sensei-mcp"
version = "0.21.1"
edition = "2024"
description = "Sensei MCP server — wraps senseid daemon for Claude Code integration"

[lib]
name = "sensei_mcp"
path = "src/lib.rs"

[[bin]]
name = "sensei-mcp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sensei-bootstrap = { workspace = true }
