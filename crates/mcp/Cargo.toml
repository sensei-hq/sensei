[package]
name = "sensei-mcp"
version = "0.7.4"
edition = "2024"
description = "Sensei MCP server — wraps senseid daemon for Claude Code integration"

[lib]
name = "sensei_mcp"
path = "src/lib.rs"

[[bin]]
name = "sensei-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sensei-bootstrap = { path = "../bootstrap" }
