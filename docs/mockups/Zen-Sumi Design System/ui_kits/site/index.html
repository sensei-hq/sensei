<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Sensei · A quiet companion for AI-assisted work</title>
  <meta name="viewport" content="width=1280"/>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <style>
    html, body { margin: 0; padding: 0; background: var(--paper); }
    body { font-family: var(--font-ui); color: var(--ink); }
  </style>
</head>
<body class="zs">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Mock.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Sections.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const { Nav, Hero, Section, HowItWorks, Philosophy, Faq, Footer, DownloadCTA } = window;

    function Site() {
      return (
        <>
          <Nav/>
          <Hero/>

          <Section id="what" eyebrow="What it is" title="One desktop app. One quiet promise.">
            <p style={{ marginTop: 0 }}>
              Sensei runs on your machine and observes your sessions with AI assistants. It logs nothing remotely; it speaks rarely; it remembers what you've actually done.
            </p>
            <p>
              Over weeks, it begins to recognize your patterns — the idioms you gravitate toward, the workarounds you've adopted, the friction points that keep recurring. When something looks worth noticing, it tells you. The rest of the time, it stays out of the way.
            </p>
          </Section>

          <HowItWorks/>

          <Philosophy/>

          <Section id="privacy" eyebrow="Privacy & local-first" title="Your sessions stay on your machine." background="var(--paper-2)">
            <div className="flex flex-col gap-5">
              {[
                { k: "蔵", title: "Local storage only",
                  text: "Transcripts, patterns, memories — all stored in a SQLite file under your home directory. Sensei never makes outbound network requests." },
                { k: "鍵", title: "No telemetry",
                  text: "We don't track usage. Updates are checked manually from Help → Check for Updates." },
                { k: "破", title: "Easy to delete",
                  text: "One folder. Delete it and sensei forgets everything. Export to JSON anytime." }
              ].map((it, i) => (
                <div key={i} style={{
                  display: 'grid', gridTemplateColumns: 'auto 1fr', gap: 'var(--space-4)',
                  paddingBottom: i < 2 ? 'var(--space-5)' : 0,
                  borderBottom: i < 2 ? 'var(--hairline)' : 'none'
                }}>
                  <span className="zs-kanji text-ink-2" style={{ fontSize: 22 }}>{it.k}</span>
                  <div>
                    <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-base)',
                                  marginBottom: 6 }}>{it.title}</div>
                    <div className="text-sm text-ink-2" style={{ lineHeight: 1.6 }}>{it.text}</div>
                  </div>
                </div>
              ))}
            </div>
          </Section>

          {/* Pricing */}
          <section style={{ borderTop: 'var(--hairline)', padding: 'var(--space-8) var(--space-7)', textAlign: 'center' }}>
            <div style={{ maxWidth: 720, margin: '0 auto' }}>
              <div className="zs-eyebrow mb-3">Pricing</div>
              <h2 style={{
                fontFamily: 'var(--font-display)', fontSize: 'var(--text-3xl)',
                fontWeight: 300, margin: '0 0 var(--space-3)', letterSpacing: '-0.02em'
              }}>
                Free. Pay what feels right.
              </h2>
              <p className="zs-body" style={{ maxWidth: 540, margin: '0 auto' }}>
                Sensei is free to download and use forever. If it earns a place in your daily practice, you can support development below — but there's no nag, no trial, no upgrade prompt. Ever.
              </p>
              <div style={{ marginTop: 'var(--space-6)' }}>
                <DownloadCTA size="lg"/>
              </div>
            </div>
          </section>

          <Faq/>
          <Footer/>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
  </script>
</body>
</html>
