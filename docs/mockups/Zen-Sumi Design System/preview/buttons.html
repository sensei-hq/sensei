<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:20px}
  .row { display: grid; grid-template-columns: 50px 1fr; gap: 16px; align-items: center; padding: 10px 0; border-top: var(--hairline); }
  .row:last-child { border-bottom: var(--hairline); }
  .row .lab { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head><body class="zs">
  <div class="row">
    <div class="lab">Large</div>
    <div class="flex items-center gap-3">
      <button class="zs-btn zs-btn-primary zs-btn-lg"><span class="zs-kanji" style="font-size:14px;color:var(--accent)">下</span> Download for macOS</button>
      <button class="zs-btn zs-btn-secondary zs-btn-lg">Draft a persona</button>
      <button class="zs-btn zs-btn-ghost zs-btn-lg">See how it works ↓</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">Default</div>
    <div class="flex items-center gap-3">
      <button class="zs-btn zs-btn-primary">Open project</button>
      <button class="zs-btn zs-btn-secondary">Draft a persona</button>
      <button class="zs-btn zs-btn-ghost">all sessions →</button>
    </div>
  </div>
  <div class="row">
    <div class="lab">Small</div>
    <div class="flex items-center gap-3">
      <button class="zs-btn zs-btn-primary zs-btn-sm">+ new project</button>
      <button class="zs-btn zs-btn-secondary zs-btn-sm">Open</button>
      <button class="zs-btn zs-btn-ghost zs-btn-sm">Dismiss</button>
    </div>
  </div>
  <div class="mt-3 text-xs text-ink-mute" style="font-family: var(--font-mono);">
    zs-btn · zs-btn-primary / -secondary / -ghost · -sm / -lg
  </div>
</body></html>
