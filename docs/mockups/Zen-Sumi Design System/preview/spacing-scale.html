<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:24px}</style>
</head><body class="zs">
  <div class="flex items-end gap-3">
    <div class="flex flex-col items-center gap-1" style="width: 14px"><div style="width:4px;height:4px;background:var(--ink-mute);border-radius:50%"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">1</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 22px"><div style="width:8px;height:8px;background:var(--ink-mute);border-radius:2px"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">2</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 30px"><div style="width:12px;height:12px;background:var(--ink-mute);border-radius:2px"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">3</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 38px"><div style="width:16px;height:16px;background:var(--ink-mute);border-radius:2px"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">4</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 50px"><div style="width:24px;height:24px;background:var(--ink-mute);border-radius:2px"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">5</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 60px"><div style="width:32px;height:32px;background:var(--ink-mute);border-radius:2px"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">6</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 80px"><div style="width:48px;height:48px;background:var(--ink-mute);border-radius:2px"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">7</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 100px"><div style="width:64px;height:64px;background:var(--ink-mute);border-radius:2px"></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">8</div></div>
    <div class="flex flex-col items-center gap-1" style="width: 110px"><div style="width:64px;height:64px;background:var(--ink-mute);border-radius:2px;position:relative"><div style="position:absolute;right:-32px;bottom:0;width:32px;height:32px;background:var(--ink-faint);border-radius:2px"></div></div><div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 9px">9 · 96</div></div>
  </div>
  <div class="mt-4 text-xs text-ink-mute" style="font-family: var(--font-mono);">4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 px</div>
</body></html>
