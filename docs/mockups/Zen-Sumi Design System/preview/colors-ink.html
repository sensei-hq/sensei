<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:20px}</style>
</head><body class="zs">
  <div class="flex gap-3" style="height: 110px;">
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--ink); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--ink</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">primary</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--ink-soft); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--ink-soft</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">secondary</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--ink-mute); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--ink-mute</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">tertiary · meta</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--ink-faint); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--ink-faint</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">faint · disabled</div>
    </div>
  </div>
</body></html>
