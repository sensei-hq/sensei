<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:20px}</style>
</head><body class="zs">
  <div class="flex gap-3" style="height: 110px;">
    <!-- paper -->
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--paper); border: var(--hairline); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--paper</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">washi 100</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--paper-soft); border: var(--hairline); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--paper-soft</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">raised · cards</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--paper-mute); border: var(--hairline); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--paper-mute</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">sunken · hover</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--paper-edge); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--paper-edge</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">hairline</div>
    </div>
  </div>
</body></html>
