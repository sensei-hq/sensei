<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:20px}</style>
</head><body class="zs">
  <div class="flex gap-3">
    <!-- Hairline card -->
    <div class="zs-card" style="flex:1; padding: 14px;">
      <div class="flex items-center gap-2 mb-2">
        <span class="zs-kanji text-accent" style="font-size: 18px">工</span>
        <div style="flex:1">
          <div class="flex items-center gap-2"><span class="zs-dot zs-dot-success"></span><span class="text-sm text-ink">Lumen Studio</span></div>
          <div class="zs-mono text-xs text-ink-mute" style="margin-top: 2px;">acme · craft</div>
        </div>
        <span class="zs-mono text-xs text-ink-mute">82</span>
      </div>
      <div class="border-t" style="padding-top: 8px; display: flex; gap: 14px;" >
        <div><div class="text-xs text-ink-mute" style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px;">FTR</div><div style="font-family: var(--font-display); font-size: 16px;">82</div></div>
        <div><div class="text-xs text-ink-mute" style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px;">7d</div><div style="font-family: var(--font-display); font-size: 16px;">41</div></div>
        <div><div class="text-xs text-ink-mute" style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px;">repos·libs</div><div style="font-family: var(--font-display); font-size: 16px;">3·12</div></div>
      </div>
    </div>
    <!-- Warning card -->
    <div class="zs-card" style="flex:1; padding: 14px;">
      <div class="flex items-center gap-2 mb-2">
        <span class="zs-kanji" style="color: var(--warning); font-size: 18px">雲</span>
        <div style="flex:1">
          <div class="flex items-center gap-2"><span class="zs-dot zs-dot-warning"></span><span class="text-sm text-ink">Lumen Cloud</span></div>
          <div class="zs-mono text-xs text-ink-mute" style="margin-top: 2px;">acme · cloud</div>
        </div>
        <span class="zs-mono text-xs text-warning">64</span>
      </div>
      <div class="border-t" style="padding-top: 8px; display: flex; gap: 14px;">
        <div><div class="text-xs text-ink-mute" style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px;">FTR</div><div style="font-family: var(--font-display); font-size: 16px; color: var(--warning)">64</div></div>
        <div><div class="text-xs text-ink-mute" style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px;">7d</div><div style="font-family: var(--font-display); font-size: 16px;">28</div></div>
        <div><div class="text-xs text-ink-mute" style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 9px;">repos·libs</div><div style="font-family: var(--font-display); font-size: 16px;">5·22</div></div>
      </div>
    </div>
    <!-- Dormant -->
    <div class="zs-card" style="flex:1; padding: 14px; opacity: 0.7;">
      <div class="flex items-center gap-2 mb-2">
        <span class="zs-kanji" style="font-size: 18px; color: var(--ink-mute);">筆</span>
        <div style="flex:1">
          <div class="flex items-center gap-2"><span class="zs-dot"></span><span class="text-sm text-ink-soft">Sketch tool</span></div>
          <div class="zs-mono text-xs text-ink-mute" style="margin-top: 2px;">studio · brush</div>
        </div>
        <span class="zs-mono text-ink-mute" style="font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em;">dormant</span>
      </div>
      <div class="border-t zs-mono text-ink-faint flex justify-between" style="padding-top: 8px; font-size: 11px;">
        <span>2 repos · 6 libs</span>
        <span>last · 3w ago</span>
      </div>
    </div>
  </div>
</body></html>
