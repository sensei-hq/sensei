<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:24px}</style>
</head><body class="zs">
  <div class="flex gap-5 items-end">
    <div class="flex flex-col items-center gap-2">
      <div class="rounded-sm" style="width:60px;height:60px;background:var(--ink);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">.rounded-sm · 4</div>
    </div>
    <div class="flex flex-col items-center gap-2">
      <div class="rounded" style="width:60px;height:60px;background:var(--ink);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">.rounded · 6</div>
    </div>
    <div class="flex flex-col items-center gap-2">
      <div class="rounded-lg" style="width:60px;height:60px;background:var(--ink);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">.rounded-lg · 10</div>
    </div>
    <div class="flex flex-col items-center gap-2">
      <div class="rounded-full" style="width:60px;height:60px;background:var(--ink);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">.rounded-full</div>
    </div>
    <div class="flex flex-col items-center gap-2" style="margin-left:24px">
      <div class="border" style="width:60px;height:60px;background:var(--paper-soft);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">square</div>
    </div>
  </div>
  <div class="mt-4 text-sm text-ink-soft" style="max-width: 520px;">
    Apply with utility classes: cards use <span class="zs-mono text-xs text-ink">.rounded-lg</span>. Buttons, inputs, badges use <span class="zs-mono text-xs text-ink">.rounded</span> or <span class="zs-mono text-xs text-ink">.rounded-sm</span>. Pills and avatars use <span class="zs-mono text-xs text-ink">.rounded-full</span>. The <span class="zs-mono text-xs text-ink">--radius</span> tokens are the source of truth behind these classes and the components.
  </div>
</body></html>
