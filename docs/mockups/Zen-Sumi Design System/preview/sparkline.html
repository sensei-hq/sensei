<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:24px}</style>
</head><body class="zs">
  <div class="flex gap-7 items-center">
    <!-- Sparkline -->
    <div class="flex flex-col gap-2">
      <svg width="160" height="40" style="color: var(--accent); display: block; overflow: visible;">
        <path d="M2 26 L13 28 L26 22 L40 24 L54 18 L66 20 L80 12 L93 16 L106 8 L120 14 L134 6 L148 10 L158 4" class="zs-sparkline"/>

      </svg>
      <div class="zs-eyebrow" style="font-size: 9.5px;">FTR · 14d</div>
      <div class="flex items-baseline gap-1">
        <span style="font-family: var(--font-display); font-size: 28px; line-height: 1;">78</span>
        <span class="text-xs text-ink-mute">%</span>
        <span class="zs-mono text-xs text-success" style="margin-left: 4px;">↑ 6%</span>
      </div>
    </div>
    <!-- Bar strip (14d) -->
    <div class="flex flex-col gap-2">
      <svg width="200" height="56" style="display: block; overflow: visible;">
        <line x1="0" x2="200" y1="28" y2="28" stroke="var(--paper-edge)" stroke-dasharray="2 3"/>
        <g>
          <rect x="0"   y="20" width="12" height="32" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="14"  y="22" width="12" height="30" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="28"  y="18" width="12" height="34" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="42"  y="20" width="12" height="32" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="56"  y="24" width="12" height="28" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="70"  y="22" width="12" height="30" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="84"  y="19" width="12" height="33" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="98"  y="16" width="12" height="36" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="112" y="20" width="12" height="32" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="126" y="14" width="12" height="38" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="140" y="18" width="12" height="34" fill="var(--ink-mute)" opacity="0.45"/>

          <rect x="168" y="16" width="12" height="36" fill="var(--ink-mute)" opacity="0.45"/>
          <rect x="182" y="10" width="12" height="42" fill="var(--accent)"/>
        </g>
      </svg>
      <div class="flex justify-between zs-mono text-ink-mute" style="font-size: 9.5px; letter-spacing: 0.08em;">
        <span>14d ago</span><span>today</span>
      </div>
    </div>
  </div>
  <div class="mt-4 text-xs text-ink-mute" style="font-family: var(--font-mono);">
    .zs-sparkline · 1.25 stroke · last point dot in <span class="text-accent">--accent</span>
  </div>
</body></html>
