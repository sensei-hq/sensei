<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:24px}</style>
</head><body class="zs">
  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="zs-badge">v0.4.2</span>
      <span class="zs-badge">38m · 3 corrections</span>
      <span class="zs-badge zs-badge-accent">3rd time</span>
      <span class="zs-badge zs-badge-success">+7% FTR</span>
      <span class="zs-badge zs-badge-warning">low urgency</span>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2"><span class="zs-dot zs-dot-accent"></span><span class="text-sm text-ink-soft">active</span></div>
      <div class="flex items-center gap-2"><span class="zs-dot zs-dot-success"></span><span class="text-sm text-ink-soft">FTR ≥ 0.8</span></div>
      <div class="flex items-center gap-2"><span class="zs-dot zs-dot-warning"></span><span class="text-sm text-ink-soft">drift detected</span></div>
      <div class="flex items-center gap-2"><span class="zs-dot"></span><span class="text-sm text-ink-soft">dormant</span></div>
    </div>
    <div class="text-xs text-ink-mute" style="font-family: var(--font-mono);">
      zs-badge · zs-dot · -accent / -success / -warning
    </div>
  </div>
</body></html>
