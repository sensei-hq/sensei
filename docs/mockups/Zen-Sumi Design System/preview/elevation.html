<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:32px}</style>
</head><body class="zs">
  <div class="flex gap-6">
    <div class="flex flex-col items-center gap-3" style="flex:1">
      <div class="border" style="width:120px;height:80px;background:var(--paper-soft);border-radius: var(--radius-lg);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">.border</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">cards, dividers</div>
    </div>
    <div class="flex flex-col items-center gap-3" style="flex:1">
      <div style="width:120px;height:80px;background:var(--paper-soft);border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">--shadow-sm</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">subtle lift</div>
    </div>
    <div class="flex flex-col items-center gap-3" style="flex:1">
      <div style="width:120px;height:80px;background:var(--paper-soft);border-radius: var(--radius-lg); box-shadow: var(--shadow);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">--shadow</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">hover, dropdowns</div>
    </div>
    <div class="flex flex-col items-center gap-3" style="flex:1">
      <div style="width:120px;height:80px;background:var(--paper-soft);border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);"></div>
      <div class="text-xs" style="font-family: var(--font-mono)">--shadow-lg</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">modals, palettes</div>
    </div>
  </div>
</body></html>
