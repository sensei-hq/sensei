<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:var(--paper)}body{padding:20px}</style>
</head><body class="zs">
  <div class="flex gap-3" style="height: 110px;">
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--accent); border-radius: var(--radius); position: relative;">
        <span class="zs-kanji" style="position:absolute; left:10px; top:8px; color: var(--paper); font-size: 22px">朱</span>
      </div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--accent</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">shu · vermillion</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--success); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--success</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">jade</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--warning); border-radius: var(--radius);"></div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">--warning</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">amber</div>
    </div>
    <div class="flex flex-col gap-2" style="flex:1">
      <div style="flex:1; background: var(--accent-soft); border: var(--hairline); border-radius: var(--radius); display:flex; align-items:center; justify-content:center;">
        <span class="text-accent text-xs" style="font-family: var(--font-mono)">soft tint</span>
      </div>
      <div class="text-xs text-ink-soft" style="font-family: var(--font-mono)">*-soft</div>
      <div class="text-xs text-ink-faint" style="font-family: var(--font-mono); font-size: 10px">badge backgrounds</div>
    </div>
  </div>
</body></html>
