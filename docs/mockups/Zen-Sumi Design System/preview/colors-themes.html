<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#e8e6df}body{padding:18px}</style>
</head><body>
  <div class="flex gap-3">
    <!-- Light -->
    <div class="zs" style="flex:1; background: var(--paper); border-radius: 10px; padding: 16px; border: var(--hairline);">
      <div class="flex items-baseline gap-2 mb-3">
        <span class="zs-kanji text-accent" style="font-size: 18px">日</span>
        <span class="text-xs uppercase text-ink-mute" style="letter-spacing: 0.18em">Light</span>
      </div>
      <div class="flex gap-2">
        <div style="flex:1; height: 36px; background: var(--paper-soft); border: var(--hairline); border-radius: 4px;"></div>
        <div style="flex:1; height: 36px; background: var(--paper-mute); border: var(--hairline); border-radius: 4px;"></div>
        <div style="flex:1; height: 36px; background: var(--ink); border-radius: 4px;"></div>
        <div style="flex:1; height: 36px; background: var(--accent); border-radius: 4px;"></div>
      </div>
      <div class="zs-h3 mt-3" style="color: var(--ink); font-size: 17px">Quiet by day.</div>
    </div>
    <!-- Dark -->
    <div class="zs" data-theme="dark" style="flex:1; background: var(--paper); border-radius: 10px; padding: 16px; border: var(--hairline);">
      <div class="flex items-baseline gap-2 mb-3">
        <span class="zs-kanji text-accent" style="font-size: 18px">夜</span>
        <span class="text-xs uppercase text-ink-mute" style="letter-spacing: 0.18em">Dark</span>
      </div>
      <div class="flex gap-2">
        <div style="flex:1; height: 36px; background: var(--paper-soft); border: var(--hairline); border-radius: 4px;"></div>
        <div style="flex:1; height: 36px; background: var(--paper-mute); border: var(--hairline); border-radius: 4px;"></div>
        <div style="flex:1; height: 36px; background: var(--ink); border-radius: 4px;"></div>
        <div style="flex:1; height: 36px; background: var(--accent); border-radius: 4px;"></div>
      </div>
      <div class="zs-h3 mt-3" style="color: var(--ink); font-size: 17px">Quiet by night.</div>
    </div>
  </div>
</body></html>
