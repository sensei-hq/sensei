<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Sensei · Dōjō — shared component kit</title>
  <meta name="viewport" content="width=1600"/>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <script src="lib/unocss.js"></script>
  <link rel="stylesheet" href="fonts.css"/>
  <script>
    (function(){
      window.addEventListener('error', function(e){
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) { e.stopImmediatePropagation(); e.preventDefault(); }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const N = window.ResizeObserver;
      window.ResizeObserver = class extends N { constructor(cb){ super((en,ob)=>{ window.requestAnimationFrame(()=>{ try{cb(en,ob);}catch(e){ if(!String(e&&e.message).includes('ResizeObserver loop')) throw e; } }); }); } };
    })();
  </script>
  <style>
    html, body { margin:0; padding:0; height:100%; background: var(--paper); font-family: 'Inter', system-ui, sans-serif; }
    #root { height: 100vh; }
    #theme-tweak {
      position: fixed; top: 14px; right: 14px; z-index: 9999;
      display: inline-flex; align-items: center; gap:var(--space-2);
      padding:var(--space-2) var(--space-3); border-radius: 999px; cursor: pointer;
      background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--paper-edge);
      font: 500 var(--text-sm)/1.2 var(--font-ui); box-shadow: var(--shadow-sm);
    }
    #theme-tweak .kanji { font-size:var(--text-sm); color: var(--accent); }
  </style>
</head>
<body>
  <button id="theme-tweak" type="button" aria-pressed="false"><span class="kanji">夜</span><span id="theme-tweak-label">Dark mode</span></button>
  <div id="root"></div>

  <script>
    (function(){
      const KEY = 'sensei-dojo-theme';
      const btn = document.getElementById('theme-tweak');
      const label = document.getElementById('theme-tweak-label');
      function apply(dark){
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        btn.setAttribute('aria-pressed', String(dark));
        btn.querySelector('.kanji').textContent = dark ? '昼' : '夜';
        label.textContent = dark ? 'Light mode' : 'Dark mode';
      }
      let dark = localStorage.getItem(KEY) === 'dark';
      apply(dark);
      btn.addEventListener('click', function(){ dark = !dark; localStorage.setItem(KEY, dark ? 'dark' : 'light'); apply(dark); });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="lib/shared/design-canvas.jsx"></script>
  <script type="text/babel" src="lib/shared/primitives.jsx"></script>
  <script src="lib/data/dojo2-data.js"></script>
  <script type="text/babel" src="lib/dojo2/dojo2-kit.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const D = window.DOJO2;

    /* ── nav definitions for the two shell contexts ── */
    const YOU_NAV = [
      { group: "Work", items: [
        { id: "work", icon: "widget-4", label: "Your work" },
        { id: "runs", icon: "eye", label: "Live runs", badge: 3 },
        { id: "projects", icon: "folder", label: "Projects" },
      ]},
      { group: "Govern", items: [
        { id: "rules", icon: "scale", label: "Constitution" },
        { id: "packs", icon: "box", label: "Rule packs" },
      ]},
      { group: "Relay", items: [
        { id: "approve", icon: "check-circle", label: "Approve", badge: 2 },
        { id: "decide", icon: "checklist-minimalistic", label: "Decide", badge: 2 },
        { id: "chat", icon: "chat-round-line", label: "Chat" },
      ]},
    ];
    const ORG_NAV = [
      { group: "Overview", items: [
        { id: "home", icon: "buildings-2", label: "Org home" },
        { id: "ladder", icon: "scale", label: "Constitution" },
        { id: "projects", icon: "folder", label: "Projects", badge: 4 },
      ]},
      { group: "Admin", items: [
        { id: "members", icon: "users-group-rounded", label: "Members & roles" },
        { id: "policies", icon: "shield-check", label: "Policies" },
        { id: "audit", icon: "clipboard-list", label: "Audit" },
      ]},
    ];
    const YOU_TABS = [
      { id: "work", icon: "widget-4", label: "Work" },
      { id: "runs", icon: "eye", label: "Runs", badge: 3 },
      { id: "inbox", icon: "checklist-minimalistic", label: "Needs", badge: 4 },
      { id: "chat", icon: "chat-round-line", label: "Chat" },
    ];
    const acme = D.dojos.find(d => d.slug === "acme");

    /* ── specimen scaffolding (canvas-only, not part of the kit) ── */
    function Spec({ title, note, children, cols = 1, minc }) {
      return (
        <div style={{ marginBottom: "var(--space-8)" }}>
          <div className="flex items-baseline gap-2" style={{ marginBottom: "var(--space-3)" }}>
            <span className="zs-eyebrow font-semibold text-ink">{title}</span>
            {note && <span className="zs-meta">{note}</span>}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: minc ? `repeat(auto-fill, minmax(${minc}px, 1fr))` : `repeat(${cols}, 1fr)`, gap: "var(--space-4)", alignItems: "start" }}>
            {children}
          </div>
        </div>
      );
    }
    function Board({ children, pad = true }) {
      return <div className="sensei bg-paper" style={{ width: "100%", height: "100%", overflow: "auto", padding: pad ? "var(--space-8)" : 0 }}>{children}</div>;
    }

    /* ── the ‘your work’ entry screen — relay actions + active projects,
         composed from the kit. This is screen (1), previewed inside the shell. ── */
    function ShellMain({ context }) {
      if (context !== "you") {
        return (
          <div style={{ padding: "var(--space-8)", display: "flex", flexDirection: "column", gap: "var(--space-4)" }}>
            <window.SectionHead eyebrow="Acme Corp · jurisdiction" title="Nine projects, four need a maintainer"
              right={<window.Button size="sm" variant="ghost" icon="tuning-2">Filter</window.Button>} />
            <div className="zs-card-flush" style={{ overflow: "hidden" }}>
              {D.orgProjects.acme.map(p => (
                <window.ProjectRow key={p.id} showDojo={false}
                  p={{ ...p, repo: "acme/" + p.name, note: p.team + " · " + p.maintainers + " maintainers", lastRun: p.runsWeek + "/wk" }} />
              ))}
            </div>
          </div>
        );
      }
      const runsWeek = D.projects.reduce((a, p) => a + p.runsWeek, 0);
      const activeRuns = D.runs.filter(r => r.state === "running").length;
      return (
        <div style={{ padding: "var(--space-8)", display: "flex", flexDirection: "column", gap: "var(--space-6)" }}>
          <window.SectionHead eyebrow="Monday · morning" title="Your work"
            right={<div className="flex items-center gap-4">
              <window.StatBadge n={runsWeek} label="runs this week" sub="↑ from 9" tone="var(--accent)" />
              <window.StatBadge n={D.needsYou.length} label="need you" />
            </div>} />

          <window.NeedsYouBand items={D.needsYou} />

          <window.ListSection icon="eye" iconColor="var(--success)" title="Live runs"
            count={activeRuns + " running"} countTone="var(--success)"
            right={<a href="#" className="mono text-xs text-ink-mute" style={{ textDecoration: "none" }}>session log →</a>}>
            {D.runs.map(r => <window.RunCard key={r.id} run={r} flat />)}
          </window.ListSection>

          <window.ListSection icon="folder" title="Active projects" count={D.projects.length}
            right={<window.Button size="sm" variant="ghost" icon="tuning-2">Filter</window.Button>}>
            {D.projects.map(p => <window.ProjectRow key={p.id} p={p} />)}
          </window.ListSection>
        </div>
      );
    }

    function App() {
      const [youNav, setYouNav] = React.useState("work");
      const [orgNav, setOrgNav] = React.useState("home");
      const [mtab, setMtab] = React.useState("work");
      const [ctx, setCtx] = React.useState("you");

      return (
        <DesignCanvas initialZoom={0.5}>

          <DCSection id="kit-intro" title="Dōjō — shared component kit"
            subtitle="The one kit every screen composes from — no per-screen hand-rolling. Grouped: the AppShell (one frame for both the personal ‘you’ context and an org context — only the nav + context header differ), the primitives, the governance plane (rules + ladder), and the relay plane (watch · approve · decide · chat). Sign off here; then all 8 screens (desktop + mobile) get built only from these parts. Dark mode toggles top-right.">

            <DCArtboard id="kit-shell-you" label="★ AppShell · personal (‘you’) context — click the org switcher" width={1240} height={780}>
              <window.AppShell label="Kit · AppShell you" context="you" org={acme} dojos={D.dojos} me={D.me}
                nav={YOU_NAV} active={youNav} onNav={setYouNav} onPick={(s)=>setCtx(s)}>
                <ShellMain context="you" />
              </window.AppShell>
            </DCArtboard>

            <DCArtboard id="kit-shell-org" label="★ AppShell · org context (admin @ Acme) — same frame, different nav + header" width={1240} height={780}>
              <window.AppShell label="Kit · AppShell org" context="org" org={acme} dojos={D.dojos} me={D.me}
                nav={ORG_NAV} active={orgNav} onNav={setOrgNav} onPick={()=>{}}>
                <ShellMain context="org" />
              </window.AppShell>
            </DCArtboard>

            <DCArtboard id="kit-shell-mobile" label="AppShell · mobile (bottom tabs)" width={390} height={780}>
              <window.MobileShell label="Kit · mobile shell" context="you" org={acme} me={D.me} tabs={YOU_TABS} active={mtab} onNav={setMtab}>
                <div style={{ padding: "var(--space-4)", display: "flex", flexDirection: "column", gap: "var(--space-3)" }}>
                  <window.SectionHead eyebrow="Monday" title="Your work" />
                  <div className="zs-card-flush" style={{ overflow: "hidden" }}>
                    {D.projects.slice(0,3).map(p => <window.ProjectRow key={p.id} p={{...p, note:null}} showDojo={false} />)}
                  </div>
                </div>
              </window.MobileShell>
            </DCArtboard>

          </DCSection>

          <DCSection id="kit-primitives" title="Primitives"
            subtitle="The atoms every screen reuses. Rows (MyDojoRow · ProjectRow), tags & pills (classification · role · phase · chip · kanji token), meaningful stats, spark & ensō, confidence, banners, and the empty state — which, true to sensei, is content, not a gap.">

            <DCArtboard id="kit-p-rows" label="Rows — MyDojoRow · ProjectRow" width={960} height={520}>
              <Board>
                <Spec title="MyDojoRow" note="org identity + your additive role · used by ‘my dōjōs’ + the switcher">
                  <div className="zs-card-flush" style={{ overflow: "hidden" }}>
                    {D.dojos.map(d => <window.DojoRow key={d.slug} dojo={d} />)}
                  </div>
                </Spec>
                <Spec title="ProjectRow" note="name · classification · dōjō · signal spark · phase · last run">
                  <div className="zs-card-flush" style={{ overflow: "hidden" }}>
                    {D.projects.map(p => <window.ProjectRow key={p.id} p={p} />)}
                  </div>
                </Spec>
              </Board>
            </DCArtboard>

            <DCArtboard id="kit-p-atoms" label="Tags · pills · chips · kanji token" width={620} height={520}>
              <Board>
                <Spec title="Classification"><div className="flex flex-wrap gap-2">
                  {["company","client","personal","community"].map(k => <window.ClassChip key={k} kind={k} />)}
                </div></Spec>
                <Spec title="Role (additive)"><div className="flex flex-wrap gap-2">
                  {["developer","maintainer","lead","admin"].map(r => <window.RoleTag key={r} role={r} />)}
                </div></Spec>
                <Spec title="Phase — watch → notice → adopt"><div className="flex flex-wrap gap-2">
                  {["watch","notice","adopt"].map(p => <window.PhasePill key={p} phase={p} />)}
                </div></Spec>
                <Spec title="Chip · KanjiToken"><div className="flex flex-wrap items-center gap-2">
                  <window.Chip icon="command">gate waiting</window.Chip>
                  <window.Chip mono tone="var(--accent)" soft="var(--accent-soft)" edge="var(--accent-edge)">4 need you</window.Chip>
                  <window.Chip tone="var(--success)" soft="var(--success-soft)" edge="var(--success-edge)">adopted</window.Chip>
                  <window.KanjiMark char="先" size="2xl" />
                  <window.KanjiMark char="観" size="xl" tone="var(--ink-mute)" />
                </div></Spec>
                <Spec title="Buttons"><div className="flex flex-wrap items-center gap-2">
                  <window.Button icon="check-circle">Primary</window.Button>
                  <window.Button variant="ghost" icon="tuning-2">Ghost</window.Button>
                  <window.Button variant="danger" icon="close-circle">Danger</window.Button>
                  <window.Button size="sm" variant="ghost">Small</window.Button>
                </div></Spec>
              </Board>
            </DCArtboard>

            <DCArtboard id="kit-p-data" label="StatBadge · Spark · Ensō · ConfidenceBar" width={620} height={520}>
              <Board>
                <Spec title="StatBadge — meaningful numbers"><div className="flex gap-4">
                  <window.StatBadge n="14" label="runs this week" sub="↑ from 9" tone="var(--accent)" />
                  <window.StatBadge n="3rd" label="time this recurred" sub="session s-2891" />
                  <window.StatBadge n="0" label="incidents" sub="30 days" tone="var(--success)" />
                </div></Spec>
                <Spec title="Spark"><div className="flex items-center gap-4">
                  <window.Spark data={D.projects[0].spark} />
                  <window.Spark data={D.projects[2].spark} color="var(--success)" />
                </div></Spec>
                <Spec title="ConfidenceBar"><div className="flex flex-col gap-2">
                  <window.ConfidenceBar v={0.94} /><window.ConfidenceBar v={0.79} /><window.ConfidenceBar v={0.62} />
                </div></Spec>
              </Board>
            </DCArtboard>

            <DCArtboard id="kit-p-notice" label="SectionHead · Banner · EmptyState" width={620} height={560}>
              <Board>
                <Spec title="SectionHead">
                  <window.SectionHead kanji="場" eyebrow="Monday · morning" title="Three projects in flight" count="3"
                    right={<window.Button size="sm" variant="ghost" icon="tuning-2">Filter</window.Button>} />
                </Spec>
                <Spec title="Banner">
                  <div className="flex flex-col gap-2">
                    <window.Banner kanji="盾" tone="accent" title="globex-portal is a client engagement">Sources are dereferenced — identifiers never leave your machine.</window.Banner>
                    <window.Banner kanji="覚" tone="success" title="‘idempotency key’ adopted org-wide">Promoted from Project to Company after six repos took it up.</window.Banner>
                    <window.Banner kanji="争" tone="warning" title="One conflict is waiting for you">Company ‘retry freely’ clashes with the project idempotency rule.</window.Banner>
                  </div>
                </Spec>
                <Spec title="EmptyState — content, not a gap">
                  <div className="zs-card-flush">
                    <window.EmptyState kanji="空" title="No dōjōs yet.">You can work entirely solo — your rules and projects stay on your machine. Join a dōjō when a team wants to share what it learns.
                      <div style={{marginTop:12}}><window.Button size="sm" icon="add-circle">Create or join</window.Button></div>
                    </window.EmptyState>
                  </div>
                </Spec>
              </Board>
            </DCArtboard>

          </DCSection>

          <DCSection id="kit-governance" title="Governance plane — rules & the ladder"
            subtitle="How a constitution is authored and resolved. The ladder stacks scopes broad → specific (Company · Client · Personal · Project · Stack); each rung carries rules, some ★ locked. RuleRow toggles inclusion and shows the level it entered from. ConflictCard states topic · winner · why. StanceDial sets autonomy / sharing / review per scope.">

            <DCArtboard id="kit-g-ladder" label="LadderRung · RuleRow" width={720} height={640}>
              <Board>
                <Spec title="LadderRung — broad → specific, expandable" note="tap a rung to select">
                  <div className="flex flex-col gap-3">
                    {D.ladder.map(r => <window.LadderRung key={r.id} rung={r} active={"project"} onSelect={()=>{}} />)}
                  </div>
                </Spec>
                <Spec title="RuleRow — toggle inclusion · level pill · ★ non-negotiable">
                  <div className="zs-card-flush" style={{ overflow: "hidden" }}>
                    <window.RuleRow onToggle={()=>{}} included={true} rule={{ text:"Never log tokens or PII, even at debug level", level:"Company", hard:true }} showLevel />
                    <window.RuleRow onToggle={()=>{}} included={true} rule={{ text:"Every money-moving mutation carries an idempotency key", level:"Project", hard:true }} showLevel />
                    <window.RuleRow onToggle={()=>{}} included={false} rule={{ text:"No default exports in shared packages", level:"Stack" }} showLevel />
                  </div>
                </Spec>
              </Board>
            </DCArtboard>

            <DCArtboard id="kit-g-conflict" label="ConflictCard · StanceDial" width={720} height={640}>
              <Board>
                <Spec title="ConflictCard — topic · winner · why">
                  <div className="flex flex-col gap-3">
                    {D.conflicts.map(c => <window.ConflictCard key={c.id} conflict={c} />)}
                  </div>
                </Spec>
                <Spec title="StanceDial — three axes, per scope">
                  <div className="flex flex-col gap-3">
                    {D.stance.map(s => <window.StanceDial key={s.id} dial={s} />)}
                  </div>
                </Spec>
              </Board>
            </DCArtboard>

          </DCSection>

          <DCSection id="kit-relay" title="Relay plane — watch · approve · decide · chat"
            subtitle="The away-from-keyboard surface. The NeedsYouBand collects everything blocked on you; RunCard shows a live session; GateCard approves or denies a command; DecisionCard signs off a rule; ChatThread is where sensei speaks — rarely.">

            <DCArtboard id="kit-r-needs" label="NeedsYouBand · RunCard" width={760} height={620}>
              <Board>
                <Spec title="NeedsYouBand">
                  <window.NeedsYouBand items={D.needsYou} />
                </Spec>
                <Spec title="RunCard — live sessions">
                  <div className="flex flex-col gap-3">
                    {D.runs.map(r => <window.RunCard key={r.id} run={r} />)}
                  </div>
                </Spec>
              </Board>
            </DCArtboard>

            <DCArtboard id="kit-r-decide" label="GateCard · DecisionCard · ChatThread" width={760} height={720}>
              <Board>
                <Spec title="GateCard — approve / deny a command">
                  <div className="flex flex-col gap-3">
                    {D.gates.map(g => <window.GateCard key={g.id} gate={g} />)}
                  </div>
                </Spec>
                <Spec title="DecisionCard — sign off a rule">
                  <window.DecisionCard decision={D.decisions[0]} />
                </Spec>
                <Spec title="ChatThread — sensei speaks rarely">
                  <div className="zs-card-flush" style={{ padding: "var(--space-4)" }}>
                    <window.ChatThread thread={D.chat.thread} me={D.me} />
                  </div>
                </Spec>
              </Board>
            </DCArtboard>

          </DCSection>

        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
