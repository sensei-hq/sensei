<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Assistants — capability tick options</title>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <style>
    html, body { margin: 0; height: 100%; background: var(--washi-50); }
    #root { height: 100vh; }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#1f3a2e"/>
      <path d="M30 52 L44 66 L72 34" fill="none" stroke="#8fd0ad" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </template>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="sensei">
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="lib/primitives.jsx"></script>
  <script type="text/babel" src="lib/brand-logos.jsx"></script>
  <script type="text/babel" src="lib/assistant-card.jsx"></script>
  <script type="text/babel" src="lib/assistant-tick-options.jsx"></script>
  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="chips" title="Assistants — all-or-nothing, with configure lifecycle"
                     subtitle="One switch per assistant registers every part (or none). Each part settles to ✓ / ✗ with an inline error + retry. Flip a switch to watch it run.">
            <DCArtboard id="live"  label="Live · light" width={480} height={700}>
              <div className="sensei"><ChipsLive/></div>
            </DCArtboard>
            <DCArtboard id="dark"  label="Live · dark"  width={480} height={700}>
              <div className="sensei" data-theme="dark" style={{ background: "var(--paper)" }}><ChipsLive/></div>
            </DCArtboard>
            <DCArtboard id="states" label="Reference · states + marks" width={380} height={620}>
              <div className="sensei"><ChipsStates/></div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
