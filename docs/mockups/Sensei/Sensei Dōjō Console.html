<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Sensei · Dōjō — console (site design)</title>
  <meta name="viewport" content="width=1600"/>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <link rel="stylesheet" href="fonts.css"/>
  <script>
    (function(){
      window.addEventListener('error', function(e){
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) { e.stopImmediatePropagation(); e.preventDefault(); }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const N = window.ResizeObserver;
      window.ResizeObserver = class extends N { constructor(cb){ super((en,ob)=>{ window.requestAnimationFrame(()=>{ try{cb(en,ob);}catch(e){ if(!String(e&&e.message).includes('ResizeObserver loop')) throw e; } }); }); } };
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: var(--paper, #f0eee9); font-family: 'Inter', system-ui, sans-serif; }
    #root { height: 100vh; }
    /* dark-mode tweak control */
    #theme-tweak {
      position: fixed; top: 14px; right: 14px; z-index: 9999;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 13px; border-radius: 999px; cursor: pointer;
      background: var(--paper-2); color: var(--ink-2);
      border: 1px solid var(--paper-edge);
      font: 500 12.5px 'Inter', system-ui, sans-serif;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    #theme-tweak .kanji { font-size: 13px; color: var(--accent); }
  </style>
</head>
<body>
  <button id="theme-tweak" type="button" aria-pressed="false">
    <span class="kanji">夜</span><span id="theme-tweak-label">Dark mode</span>
  </button>
  <div id="root"></div>

  <script>
    (function(){
      const KEY = 'sensei-dojo-theme';
      const btn = document.getElementById('theme-tweak');
      const label = document.getElementById('theme-tweak-label');
      function apply(dark){
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        btn.setAttribute('aria-pressed', String(dark));
        btn.querySelector('.kanji').textContent = dark ? '昼' : '夜';
        label.textContent = dark ? 'Light mode' : 'Dark mode';
      }
      let dark = localStorage.getItem(KEY) === 'dark';
      apply(dark);
      btn.addEventListener('click', function(){
        dark = !dark;
        localStorage.setItem(KEY, dark ? 'dark' : 'light');
        apply(dark);
      });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="lib/shared/design-canvas.jsx"></script>
  <script type="text/babel" src="lib/shared/primitives.jsx"></script>
  <script src="lib/data/dojo-data.js"></script>
  <script src="lib/data/extensions-data.js"></script>
  <script type="text/babel" src="lib/dojo/dojo-shared.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-admin.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-governance.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-identity.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-billing.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-maintainer.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-extensions.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-lead.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-developer.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-relay.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-saas.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const W = 1340, H = 940;

    function App() {
      return (
        <DesignCanvas initialZoom={0.5}>
          <DCSection id="dojo-saas"
                     title="Dōjō · SaaS entry"
                     subtitle="Now that Dōjō has a hosted SaaS (dojo.sensei-hq.com) alongside optional self-hosted servers, the pre-console moments: a welcome-back / sign-in page, the multi-org picker for returning members, and — for a brand-new user who belongs to nothing yet — the empty state and the create-a-Dōjō flow (name it, choose hosting, decide who joins). GitHub is the primary login; the same sign-in works for self-hosted Dōjōs.">
            <DCArtboard id="saas-signin" label="★ Welcome back · sign in" width={W} height={H}>
              <DojoSignIn/>
            </DCArtboard>
            <DCArtboard id="saas-signin-mobile" label="★ Sign in · mobile (first screen on a phone)" width={390} height={844}>
              <div style={{ width: 390, height: 844, borderRadius: 44, overflow: "hidden", border: "1px solid var(--edge)" }}><DojoSignIn mobile={true}/></div>
            </DCArtboard>
            <DCArtboard id="saas-orgs" label="★ Your organizations · multi-membership" width={W} height={H}>
              <DojoOrgs/>
            </DCArtboard>
            <DCArtboard id="saas-empty" label="★ First time · no Dōjōs yet" width={W} height={H}>
              <DojoOrgsEmpty/>
            </DCArtboard>
            <DCArtboard id="saas-create" label="★ Create a Dōjō · name · hosting · who joins" width={W} height={H}>
              <DojoCreate/>
            </DCArtboard>
            <DCArtboard id="saas-orgs-mobile" label="Your Dōjōs · mobile" width={390} height={844}>
              <div style={{ width: 390, height: 844, borderRadius: 44, overflow: "hidden", border: "1px solid var(--edge)" }}><DojoOrgs/></div>
            </DCArtboard>
            <DCArtboard id="saas-empty-mobile" label="First entry · mobile" width={390} height={844}>
              <div style={{ width: 390, height: 844, borderRadius: 44, overflow: "hidden", border: "1px solid var(--edge)" }}><DojoOrgsEmpty/></div>
            </DCArtboard>
            <DCArtboard id="saas-create-mobile" label="Create a Dōjō · mobile" width={390} height={844}>
              <div style={{ width: 390, height: 844, borderRadius: 44, overflow: "hidden", border: "1px solid var(--edge)" }}><DojoCreate/></div>
            </DCArtboard>
          </DCSection>

          <DCSection id="dojo-console"
                     title="Dōjō · Console — per role"
                     subtitle="The company-hosted governance site, split by who's using it. One console per role, each showing only the panels that role owns. Click the nav within a console to move between its panels; in the Maintainer console, click a triage row to open a candidate.">
            <DCArtboard id="admin" label="★ Admin console · Overview · Monitor · Members · Scopes" width={W} height={H}>
              <DojoAdminConsole initial="overview"/>
            </DCArtboard>
            <DCArtboard id="governance" label="★ Governance · define rules · skills · agents · memory per scope" width={W} height={H}>
              <DojoAdminConsole initial="governance"/>
            </DCArtboard>
            <DCArtboard id="billing" label="★ Plan & billing · free public/personal · paid team · Relay tiering" width={W} height={H}>
              <DojoAdminConsole initial="billing"/>
            </DCArtboard>
            <DCArtboard id="billing-pastdue" label="Plan & billing · past-due / dunning state" width={W} height={H}>
              <div className="artboard-shell" style={{ height: "100%" }}><DojoBilling past={true}/></div>
            </DCArtboard>
            <DCArtboard id="identity" label="★ Identity & SSO · OIDC/SAML · SCIM · git-role mapping" width={W} height={H}>
              <DojoAdminConsole initial="identity"/>
            </DCArtboard>
            <DCArtboard id="maintainer" label="★ Maintainer console · Triage → Candidate · Knowledge" width={W} height={H}>
              <DojoMaintainerConsole initial="triage"/>
            </DCArtboard>
            <DCArtboard id="catalog" label="★ Extensions catalog · team-shared skills · agents · commands" width={W} height={H}>
              <DojoMaintainerConsole initial="catalog"/>
            </DCArtboard>
            <DCArtboard id="approvals" label="★ Approvals · second-approver queue" width={W} height={H}>
              <DojoMaintainerConsole initial="approvals"/>
            </DCArtboard>
            <DCArtboard id="lead" label="★ Lead console · Clients · Audit" width={W} height={H}>
              <DojoLeadConsole initial="clients"/>
            </DCArtboard>
            <DCArtboard id="developer" label="★ Developer console · My teams · Contributions · For me" width={W} height={H}>
              <DojoDeveloperConsole initial="teams"/>
            </DCArtboard>
          </DCSection>

          <DCSection id="dojo-relay-desktop"
                     title="Dōjō · Relay in the console"
                     subtitle="Relay isn't mobile-only. Every role's console now carries a “Relay · you” group at the top of the rail — Projects · Inbox · Chat — the same features as the phone, laid out wide. Per-user across all your Dōjōs; the daemon's live line to the Dōjō service (Supabase realtime) is what makes it current. Same information architecture as the mobile tabs, so the two stay consistent.">
            <DCArtboard id="r-projects" label="★ Relay · Projects — active work across all your Dōjōs" width={W} height={H}>
              <DojoDeveloperConsole relayStart="projects"/>
            </DCArtboard>
            <DCArtboard id="r-inbox" label="★ Relay · Inbox — two-pane: queue + approve/decide" width={W} height={H}>
              <DojoDeveloperConsole relayStart="inbox"/>
            </DCArtboard>
            <DCArtboard id="r-watch" label="Relay · Watch progress — phases + activity" width={W} height={H}>
              <DojoDeveloperConsole relayStart="watch"/>
            </DCArtboard>
            <DCArtboard id="r-logs" label="Relay · Session log — full timestamped trail" width={W} height={H}>
              <DojoDeveloperConsole relayStart="logs"/>
            </DCArtboard>
            <DCArtboard id="r-chat" label="Relay · Chat with a running session" width={W} height={H}>
              <DojoAdminConsole relayStart="chat"/>
            </DCArtboard>
          </DCSection>

          <DCSection id="dojo-mobile"
                     title="Dōjō · Mobile — Relay, folded in"
                     subtitle="The Dōjō is responsive, so it opens on a phone — and that's where Relay now lives. The local daemon holds a live connection to the Dōjō service (Supabase realtime), so your phone reaches a running session through the Dōjō: no device pairing, no separate install (the native app coexists for push + offline). Home is role-agnostic and per-user — every project running for you, across every Dōjō. The five away-from-keyboard moments: watch progress, approve a gated command, answer a decision, nudge a stalled track, and chat back mid-session.">
            <DCArtboard id="m-projects" label="★ Home · active projects across all your Dōjōs" width={390} height={844}>
              <DojoMobileProjects/>
            </DCArtboard>
            <DCArtboard id="m-inbox" label="Inbox · decisions + approvals + nudges" width={390} height={844}>
              <DojoMobileInbox/>
            </DCArtboard>
            <DCArtboard id="m-project" label="★ Watch progress · phases + activity + log" width={390} height={844}>
              <DojoMobileProject/>
            </DCArtboard>
            <DCArtboard id="m-approve" label="★ Approve a gated action · the exact command" width={390} height={844}>
              <DojoMobileApprove/>
            </DCArtboard>
            <DCArtboard id="m-decision" label="Decision · 3–4 options + type your own" width={390} height={844}>
              <DojoMobileDecision/>
            </DCArtboard>
            <DCArtboard id="m-chat" label="Chat back to sensei · mid-session" width={390} height={844}>
              <DojoMobileChat/>
            </DCArtboard>
            <DCArtboard id="m-logs" label="Session log · full timestamped trail" width={390} height={844}>
              <DojoMobileLogs/>
            </DCArtboard>
            <DCArtboard id="m-offline" label="★ Relay offline · connection lost (realtime failure mode)" width={390} height={844}>
              <DojoMobileConn kind="offline"/>
            </DCArtboard>
            <DCArtboard id="m-ended" label="Relay · session ended" width={390} height={844}>
              <DojoMobileConn kind="ended"/>
            </DCArtboard>
            <DCArtboard id="m-more" label="More · consoles + switch Dōjō on mobile" width={390} height={844}>
              <DojoMobileMore/>
            </DCArtboard>
            <DCArtboard id="m-connect" label="★ How Relay works now · through your Dōjō (realtime)" width={390} height={844}>
              <DojoMobileConnect/>
            </DCArtboard>
          </DCSection>

          <DCSection id="dojo-mobile-consoles"
                     title="Dōjō · Consoles on a phone"
                     subtitle="Everything responsive — the governance consoles adapt to a phone too, not just the Relay surfaces. The dense side-rail collapses to a bottom tab bar; the top bar condenses to org + role + a live pill. Same panels, reachable on the go.">
            <DCArtboard id="mc-admin" label="Admin console · mobile" width={390} height={844}>
              <DojoAdminConsole initial="overview" mobile/>
            </DCArtboard>
            <DCArtboard id="mc-maintainer" label="Maintainer console · mobile" width={390} height={844}>
              <DojoMaintainerConsole initial="triage" mobile/>
            </DCArtboard>
            <DCArtboard id="mc-developer" label="Developer console · mobile" width={390} height={844}>
              <DojoDeveloperConsole initial="teams" mobile/>
            </DCArtboard>
          </DCSection>

          <DCSection id="dojo-kanji-legend"
                     title="Kanji legend"
                     subtitle="Every functional kanji in the console, decoded. Kanji sit beside a text label in the UI — never as the sole marker of a state — so this is a reference, not a decoder ring.">
            <DCArtboard id="kanji-legend" label="Kanji marks · glossary" width={W} height={620}>
              <div className="sensei bg-paper" style={{ width: "100%", height: "100%", overflow: "auto" }}>
                <div className="p-6" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)" }}>
                  {[["結","Dōjō / team"],["社","Org / company"],["組","Team"],["件","Project"],["技","Stack / skill"],["己","Personal"],["群","Community / collective"],["客","Client"],
                    ["掟","Governance rules"],["問","Agents & personas"],["令","Commands"],["庫","Catalog / library"],["蔵","Knowledge"],["門","Triage"],["承","Second approval"],["検","Review gate"],
                    ["携","Relay"],["場","Projects"],["決","Decision / inbox"],["話","Chat"],["録","Session log / audit"],["観","Monitor / observe"],["盾","Anonymize / confidentiality"],["守","Guard"],
                    ["任","Members & roles"],["規","Scopes & policies"],["鍵","Identity / SSO"],["円","Plan & billing"],["迎","Onboarding / inherit"],["絶","Connection lost"],["了","Session ended"],["眠","Daemon asleep"]
                  ].map(([k, m]) => (
                    <div key={k} className="bg-paper-soft border-1px border-paper-edge gap-3 p-3" style={{ display: "flex", alignItems: "center", borderRadius: "var(--radius-lg)", margin: 6 }}>
                      <span className="kanji text-2xl text-accent" style={{ width: 30, textAlign: "center", flexShrink: 0 }}>{k}</span>
                      <span className="text-sm text-ink">{m}</span>
                    </div>
                  ))}
                </div>
              </div>
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
