<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Sensei · Dōjō — console (site design)</title>
  <meta name="viewport" content="width=1600"/>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <link rel="stylesheet" href="fonts.css"/>
  <script>
    (function(){
      window.addEventListener('error', function(e){
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) { e.stopImmediatePropagation(); e.preventDefault(); }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const N = window.ResizeObserver;
      window.ResizeObserver = class extends N { constructor(cb){ super((en,ob)=>{ window.requestAnimationFrame(()=>{ try{cb(en,ob);}catch(e){ if(!String(e&&e.message).includes('ResizeObserver loop')) throw e; } }); }); } };
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="lib/shared/design-canvas.jsx"></script>
  <script type="text/babel" src="lib/shared/primitives.jsx"></script>
  <script src="lib/data/dojo-data.js"></script>
  <script type="text/babel" src="lib/dojo/dojo-shared.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-admin.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-maintainer.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-lead.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-developer.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-saas.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const W = 1340, H = 940;

    function App() {
      return (
        <DesignCanvas initialZoom={0.5}>
          <DCSection id="dojo-saas"
                     title="Dōjō · SaaS entry"
                     subtitle="Now that Dōjō has a hosted SaaS (dojo.sensei-hq.com) alongside optional self-hosted servers, two screens precede the console: a welcome-back / sign-in page with insight into the org's shared mind, and the multi-org picker. GitHub is the primary login; the same sign-in works for self-hosted Dōjōs.">
            <DCArtboard id="saas-signin" label="★ Welcome back · sign in" width={W} height={H}>
              <DojoSignIn/>
            </DCArtboard>
            <DCArtboard id="saas-orgs" label="★ Your organizations · multi-membership" width={W} height={H}>
              <DojoOrgs/>
            </DCArtboard>
          </DCSection>

          <DCSection id="dojo-console"
                     title="Dōjō · Console — per role"
                     subtitle="The company-hosted governance site, split by who's using it. One console per role, each showing only the panels that role owns. Click the nav within a console to move between its panels; in the Maintainer console, click a triage row to open a candidate.">
            <DCArtboard id="admin" label="★ Admin console · Overview · Monitor · Members · Scopes" width={W} height={H}>
              <DojoAdminConsole initial="overview"/>
            </DCArtboard>
            <DCArtboard id="maintainer" label="★ Maintainer console · Triage → Candidate · Knowledge" width={W} height={H}>
              <DojoMaintainerConsole initial="triage"/>
            </DCArtboard>
            <DCArtboard id="lead" label="★ Lead console · Clients · Audit" width={W} height={H}>
              <DojoLeadConsole initial="clients"/>
            </DCArtboard>
            <DCArtboard id="developer" label="★ Developer console · My teams · Contributions · For me" width={W} height={H}>
              <DojoDeveloperConsole initial="teams"/>
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
