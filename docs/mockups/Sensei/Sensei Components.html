  <script>
    // Swallow the benign ResizeObserver "loop completed" warning emitted by
    // the design canvas's pan-zoom logic. Two layers: wrap the RO callback in
    // rAF, and intercept the global error event the browser fires.
    (function() {
      window.addEventListener('error', function(e) {
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const NativeRO = window.ResizeObserver;
      window.ResizeObserver = class extends NativeRO {
        constructor(cb) {
          super((entries, observer) => {
            window.requestAnimationFrame(() => {
              try { cb(entries, observer); } catch (e) {
                if (!String(e && e.message).includes('ResizeObserver loop')) throw e;
              }
            });
          });
        }
      };
    })();
  </script>

  <script type="text/babel" data-presets="env,react">
    // Tweaks — dark/light mode
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light"
    }/*EDITMODE-END*/;

    const App = () => {
      const [editMode, setEditMode] = React.useState(false);
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

      // Apply theme to the document for tokens to cascade
      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', tweaks.theme);
      }, [tweaks.theme]);

      // Edit mode protocol
      React.useEffect(() => {
        const onMsg = (e) => {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode') setEditMode(true);
          if (d.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const setTweak = (k, v) => {
        const next = { ...tweaks, [k]: v };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      };

      return (
        <>
          <DesignCanvas initialZoom={0.5}>
            {/* ═════════════════════════════════════════════════════════════
                SUPPORTING CARDBOARDS · per-screen explorations
                Each section below is one screen reachable from a top flow,
                shown in isolation so reviewers can compare layouts and
                interaction options without the full shell around it.
               ═════════════════════════════════════════════════════════════ */}

            {/* ─── Projects index (reached from Collective sidebar) ───── */}
            <DCSection id="nav"
                       title="Supporting · Projects index"
                       subtitle="Reached from the Collective sidebar's Projects entry. Cards grid with search + status filter; denser cards; dormant and archived still show up.">

                <div className="artboard-shell"><ProjectsIndexA/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Libraries ─────────────────────────────────────────── */}

                       title="Supporting · Libraries"
                       subtitle="Reached from the Collective sidebar. A library is a library — regardless of how it arrived. Sensei wraps these into its own instruments.">
              <DCArtboard id="lib-a" label="Unified list + detail" width={1280} height={860}>
                <div className="artboard-shell"><LibrariesVariantA/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Instruments ───────────────────────────────────────── */}
            <DCSection id="instruments"
                       title="Supporting · Instruments · MCP tools"
                       subtitle="Three distinct destinations reached from the Collective sidebar — Playground (try tools) · Replay (session tool-call log) · Health (usage + effectiveness).">
              <DCArtboard id="inst-playground" label="★ Playground · tree-grouped tools" width={1280} height={860}>
                <div className="artboard-shell"><InstrumentsPlaygroundSimple/></div>
              </DCArtboard>
              <DCArtboard id="inst-replay" label="Replay · per-session tool-call timeline" width={1280} height={860}>
                <div className="artboard-shell"><InstrumentsReplaySimple/></div>
              </DCArtboard>
              <DCArtboard id="inst-health" label="Health · usage + effectiveness" width={1280} height={860}>
                <div className="artboard-shell"><InstrumentsHealthSimple/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Learnings (memory & pattern explorations) ─────────── */}
            <DCSection id="learnings"
                       title="Supporting · Insights / Memories · explorations"
                       subtitle="Patterns · memories · corrections across every project. Recommendations inbox proposes what to do — promote a pattern, write a skill, reinforce a memory, transfer one to another project. Click any memory to see the full anatomy.">
              <DCArtboard id="learn-triage" label="★ Triage — by immediacy (Now / Soon / Settled)" width={1280} height={900}>
                <div className="artboard-shell"><LearningsTriage/></div>
              </DCArtboard>
              <DCArtboard id="learn-anatomy-v2" label="★ Anatomy v2 — quieter rail + 3 blocks" width={1280} height={900}>
                <div className="artboard-shell"><LearningsAnatomyV2/></div>
              </DCArtboard>
              <DCArtboard id="learn-anatomy" label="Anatomy v1 — original 4-block layout" width={1280} height={900}>
                <div className="artboard-shell"><LearningsAnatomy/></div>
              </DCArtboard>

            {/* ─── Agent + persona editors ───────────────────────────── */}

              <DCArtboard id="agent-editor" label="★ Agent editor · 4-level autonomy + replay test" width={1280} height={1000}>
                <div className="artboard-shell"><AgentEditor/></div>

            {/* ─── Inference settings ────────────────────────────────── */}

                       title="Supporting · Benchmark · sensei vs no-sensei on the same tasks"
                       subtitle="A corpus is a repo with a /tasks folder. Sensei runs each task twice — bare assistant, then with full sensei tools — and reports the diff. Two presentations: a dashboard for browsing runs, and a long-scroll lab notebook for one run in depth.">
              <DCArtboard id="bench-dashboard" label="★ A · Dashboard — corpora + runs table + run detail card" width={1280} height={1050}>
                <div className="artboard-shell"><BenchmarkRunnerDashboard/></div>
              </DCArtboard>
              <DCArtboard id="bench-notebook" label="B · Lab notebook — single run as long-scroll report" width={1280} height={1400}>
                <div className="artboard-shell"><BenchmarkRunnerNotebook/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Memory · share + consolidate ──────────────────────── */}
            <DCSection id="memory-collective"
                       title="Supporting · Memory · share & consolidate"
                       subtitle="The two memory-side screens that surface what's leaving and what's overlapping. Review-before-sharing previews the next batch; consolidation review proposes merges that compress the memory set.">
              <DCArtboard id="share-review" label="★ Review before sharing · next batch preview" width={1280} height={900}>
                <div className="artboard-shell"><ObsSharingReview/></div>

              <DCArtboard id="consolidation" label="Consolidation · merge overlapping memories" width={1280} height={900}>
                <div className="artboard-shell"><ObsConsolidation/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Document traceability ─────────────────────────────── */}
            <DCSection id="traceability"
                       title="Supporting · Document traceability · doc ↔ code drift"
                       subtitle="Per-project doc health, surfaced in the project window. Every doc-to-symbol link, checked nightly. Drift becomes visible before it causes a session correction. Drifted/broken refs ship a fix-drift prompt to the assistant.">
              <DCArtboard id="trace-rollup" label="★ Project rollup + per-doc reference detail" width={1280} height={900}>
                <div className="artboard-shell"><ObsTraceability/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Change impact ─────────────────────────────────────── */}
            <DCSection id="impact"
                       title="Supporting · Change impact · did sensei's advice work?"
                       subtitle="Closes the loop on every accepted recommendation. Before/after FTR + corrections + tool usage; the MOE panel writes a verdict and reasoning. The negative-impact alert is the dedicated regression safety screen.">
              <DCArtboard id="impact-list" label="★ Impact reports · positive / neutral / negative" width={1280} height={900}>
                <div className="artboard-shell"><ObsImpact/></div>
              </DCArtboard>
              <DCArtboard id="impact-negative" label="Negative impact alert · regression safety net" width={1280} height={900}>
                <div className="artboard-shell"><ObsNegativeAlert/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Collective intelligence settings ──────────────────── */}
            <DCSection id="collective-settings"
                       title="Supporting · Collective intelligence settings"
                       subtitle="The wizard promised this; this is where the user controls it after setup. Sharing mode + cadence + per-category filter + sharing history + lifetime contribution + privacy controls.">
              <DCArtboard id="ci-settings" label="★ Sharing mode · categories · history · contribution" width={1280} height={1000}>
                <div className="artboard-shell"><ObsCollectiveSettings/></div>
              </DCArtboard>
            </DCSection>
        </DesignCanvas>

          {editMode && (
            <div style={{
              position: 'fixed', right: 20, bottom: 20, zIndex: 999,
              background: 'var(--paper)', border: '1px solid var(--edge)',
              borderRadius: 'var(--radius-lg)', padding: 'var(--space-4)', width: 240,
              boxShadow: 'var(--shadow)',
              fontFamily: 'var(--font-ui)'
            }}>
              <div style={{ fontSize: 'var(--text-xs)', letterSpacing: 'var(--tracking-wide)', textTransform: 'uppercase',
                            color: 'var(--ink-3)', marginBottom: 'var(--space-3)', fontWeight: 500 }}>Tweaks</div>
              <div style={{ fontSize: 'var(--text-sm)', color: 'var(--ink-2)', marginBottom: 'var(--space-1)' }}>Theme</div>
              <div style={{ display: 'flex', gap: 4, padding: 3, background: 'var(--paper-3)',
                            borderRadius: 'var(--radius)' }}>
                {['light','dark'].map(t => (
                  <button key={t} onClick={() => setTweak('theme', t)}
                          style={{ flex: 1, padding: '6px 10px', fontSize: 'var(--text-sm)', border: 'none',
                                    borderRadius: 'var(--radius-sm)', background: tweaks.theme === t ? 'var(--paper)' : 'transparent',
                                    color: tweaks.theme === t ? 'var(--ink)' : 'var(--ink-3)',
                                    cursor: 'pointer' }}>
                    {t === 'light' ? '日 light' : '夜 dark'}
                  </button>
                ))}
              </div>
              <div style={{ fontSize: 'var(--text-xs)', color: 'var(--ink-3)', marginTop: 'var(--space-3)', lineHeight: 1.5 }}>
                All three directions share the token system. Switching recolours washi paper + sumi ink together.
              </div>
            </div>
          )}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
