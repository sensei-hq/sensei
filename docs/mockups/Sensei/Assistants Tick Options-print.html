<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Assistants — capability tick options (print)</title>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <style>
    html, body { margin: 0; background: var(--washi-50); }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .page {
      box-sizing: border-box;
      width: 100%;
      padding: 28px 32px 40px;
      break-after: page;
    }
    .page:last-child { break-after: auto; }

    .page-head { margin-bottom: 18px; }
    .page-head .eyebrow {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-3); font-weight: 500;
    }
    .page-head h1 {
      font-family: var(--font-display); font-weight: 300;
      font-size: 26px; letter-spacing: -0.02em; margin: 4px 0 0;
    }
    .page-head p { font-size: 13px; color: var(--ink-3); margin: 6px 0 0; max-width: 640px; line-height: 1.5; }

    /* Two live cards side-by-side; reference below */
    .board {
      display: inline-block;
      width: 480px; max-width: 100%;
      border: var(--hairline); border-radius: 14px;
      background: var(--paper); overflow: hidden;
      vertical-align: top;
      break-inside: avoid;
    }
    .board.ref { width: 400px; }
    .board.dark { background: oklch(0.170 0.010 50); }
    .board-cap {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-3); padding: 10px 14px 0; font-family: var(--font-mono);
    }

    .row { display: flex; flex-wrap: wrap; gap: 26px; }

    @page { size: portrait; margin: 1cm; }
  </style>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#1f3a2e"/>
      <path d="M30 52 L44 66 L72 34" fill="none" stroke="#8fd0ad" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </template>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="sensei">
  <div id="root"></div>

  <script type="text/babel" src="lib/brand-logos.jsx"></script>
  <script type="text/babel" src="lib/assistant-card.jsx"></script>
  <script type="text/babel" src="lib/assistant-tick-options.jsx"></script>
  <script type="text/babel">
    function PrintDoc() {
      return (
        <div>
          {/* Page 1 — Live cards, light + dark */}
          <div className="page">
            <div className="page-head">
              <div className="eyebrow">連 · Assistants</div>
              <h1>Assistants — all-or-nothing, with configure lifecycle</h1>
              <p>One switch per assistant registers every part (or none). Each part settles to ✓ / ✗ with an inline error + retry. Shown in light and dark.</p>
            </div>
            <div className="row">
              <div className="board">
                <div className="board-cap">Live · light</div>
                <div className="sensei"><ChipsLive/></div>
              </div>
              <div className="board dark">
                <div className="board-cap" style={{ color: "var(--ink-3)" }}>Live · dark</div>
                <div className="sensei" data-theme="dark" style={{ background: "transparent" }}><ChipsLive/></div>
              </div>
            </div>
          </div>

          {/* Page 2 — Reference */}
          <div className="page">
            <div className="page-head">
              <div className="eyebrow">Reference</div>
              <h1>Part states &amp; brand marks</h1>
              <p>Chips are status-only; one <span className="mono">status</span> prop per part drives empty / spinner / check / cross. Brand marks render with currentColor so a single mark works in light and dark.</p>
            </div>
            <div className="row">
              <div className="board ref">
                <div className="sensei"><ChipsStates/></div>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<PrintDoc/>);

    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      setTimeout(() => window.print(), 700);
    })();
  </script>
</body>
</html>
