<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Sensei · Dōjō app — journey audit</title>
<meta name="viewport" content="width=1280"/>
<link rel="stylesheet" href="lib/tokens.css"/>
<script src="lib/unocss.js"></script>
<link rel="stylesheet" href="fonts.css"/>
<style>
  html,body{margin:0;padding:0;background:var(--paper-2);color:var(--ink);
    font-family:var(--font-ui,'Inter',system-ui,sans-serif);-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  .kanji,.k{font-family:var(--font-kanji,serif)}
  .wrap{max-width:1180px;margin:0 auto;padding:var(--space-16) var(--space-12) var(--space-24)}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}

  /* masthead */
  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-8);
    border-bottom:1px solid var(--ink);padding-bottom:var(--space-6)}
  .mast .lede{display:flex;align-items:flex-start;gap:var(--space-4)}
  .mast .mk{font-family:var(--font-kanji);font-size:var(--text-4xl);color:var(--accent);line-height:.85}
  .eyebrow{font-size:var(--text-xs);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .mast h1{font-family:var(--font-display);font-weight:300;font-size:var(--text-3xl);letter-spacing:-0.02em;margin:var(--space-2) 0 0;line-height:1.03}
  .mast p{font-size:var(--text-sm);color:var(--ink-2);line-height:1.6;margin:var(--space-3) 0 0;max-width:640px}
  .meta{text-align:right;font-size:var(--text-xs);color:var(--ink-3);line-height:1.9;font-family:var(--font-mono);flex-shrink:0}
  .meta b{color:var(--ink);font-weight:600}

  .sec{margin-top:var(--space-16)}
  .sec-head{display:flex;align-items:baseline;gap:var(--space-3);border-bottom:1px solid var(--edge);padding-bottom:var(--space-3);margin-bottom:var(--space-6)}
  .sec-head .num{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--accent);letter-spacing:.06em}
  .sec-head h2{font-family:var(--font-display);font-weight:400;font-size:var(--text-2xl);letter-spacing:-0.02em;margin:0}
  .sec-head .hint{margin-left:auto;font-size:var(--text-xs);color:var(--ink-3)}

  /* scorecard */
  .scorecard{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);margin-bottom:var(--space-8)}
  .score{background:var(--paper);border:1px solid var(--edge);border-radius:var(--radius-lg);padding:var(--space-4);position:relative;overflow:hidden}
  .score::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%}
  .score.strong::before{background:var(--success)} .score.partial::before{background:var(--warning)} .score.weak::before{background:var(--accent)}
  .score .n{font-family:var(--font-display);font-size:var(--text-3xl);font-weight:300;line-height:1;letter-spacing:-0.02em}
  .score .lab{font-size:var(--text-sm);font-weight:600;color:var(--ink);margin-top:var(--space-1)}
  .score .sub{font-size:var(--text-xs);color:var(--ink-3);margin-top:var(--space-1);line-height:1.4}

  /* emotion curve */
  .curve{background:var(--paper);border:1px solid var(--edge);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-6) var(--space-4);margin-bottom:var(--space-3)}
  .curve svg{display:block;width:100%;height:190px;overflow:visible}
  .curve .cx{font-family:var(--font-kanji);font-size:15px;fill:var(--accent)}
  .curve .cl{font-size:11px;fill:var(--ink-3);font-family:var(--font-ui,'Inter',sans-serif)}
  .curve .cv{font-family:var(--font-mono);font-size:10px;fill:var(--ink-4)}
  .curve-cap{font-size:var(--text-xs);color:var(--ink-3);margin-top:var(--space-2);text-align:center}

  /* themes */
  .themes{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}
  .theme{background:var(--paper);border:1px solid var(--edge);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-6);display:flex;gap:var(--space-4)}
  .theme .tk{font-family:var(--font-kanji);font-size:var(--text-2xl);color:var(--accent);line-height:1;flex-shrink:0}
  .theme h3{font-family:var(--font-display);font-weight:500;font-size:var(--text-base);margin:0 0 var(--space-1);letter-spacing:-0.01em}
  .theme p{margin:0;font-size:var(--text-xs);color:var(--ink-2);line-height:1.6}

  /* callout */
  .callout{margin-top:var(--space-8);background:var(--ink);color:var(--paper);border-radius:var(--radius-lg);padding:var(--space-8);display:flex;gap:var(--space-6);align-items:flex-start}
  .callout .ck{font-family:var(--font-kanji);font-size:var(--text-4xl);line-height:.9;color:var(--accent);flex-shrink:0}
  .callout .eyebrow{color:oklch(0.78 0.13 40)}
  .callout h3{font-family:var(--font-display);font-weight:400;font-size:var(--text-xl);margin:var(--space-2) 0;letter-spacing:-0.015em;color:var(--paper)}
  .callout p{margin:0;font-size:var(--text-sm);line-height:1.7;color:var(--on-primary-soft);max-width:760px}

  /* stage card */
  .stage{background:var(--paper);border:1px solid var(--edge);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-4)}
  .stage-head{display:flex;align-items:flex-start;gap:var(--space-4);padding:var(--space-6) var(--space-6) var(--space-4);border-bottom:1px solid var(--edge)}
  .stage-head .sk{font-family:var(--font-kanji);font-size:var(--text-2xl);color:var(--accent);line-height:1;flex-shrink:0;width:48px;height:48px;
    display:flex;align-items:center;justify-content:center;border-radius:var(--radius);background:var(--accent-soft);border:1px solid var(--accent-edge)}
  .stage-head .n{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--ink-4);letter-spacing:.06em}
  .stage-head .ttl{flex:1;min-width:0}
  .stage-head .ttl .seg{font-size:var(--text-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  .stage-head .ttl h4{font-family:var(--font-display);font-weight:400;font-size:var(--text-xl);margin:0;letter-spacing:-0.015em}
  .stage-head .surf{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--ink-3);margin-top:var(--space-2)}
  .hv{text-align:right;flex-shrink:0}
  .hv .v{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:300;line-height:1}
  .hv .l{font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
  .pill{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:var(--radius-full);font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.strong{background:var(--success-soft);color:var(--success);border:1px solid var(--success-edge)}
  .pill.partial{background:var(--warning-soft);color:oklch(0.52 0.13 60);border:1px solid var(--warning-edge)}
  .pill.weak{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-edge)}

  .does{padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--edge);font-size:var(--text-sm);color:var(--ink-2);line-height:1.65}
  .does b{color:var(--ink);font-weight:600}
  .lenses{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
  .lens{padding:var(--space-4) var(--space-6);border-right:1px solid var(--edge)}
  .lens:last-child{border-right:none}
  .lens .ll{font-size:var(--text-xs);letter-spacing:.13em;text-transform:uppercase;font-weight:700;margin-bottom:var(--space-3);display:flex;align-items:center;gap:var(--space-2)}
  .lens .ll .dot{width:7px;height:7px;border-radius:50%}
  .lens.fr .ll{color:oklch(0.52 0.13 60)} .lens.fr .dot{background:var(--warning)}
  .lens.gp .ll{color:var(--ink-3)} .lens.gp .dot{background:var(--ink-4)}
  .lens.op .ll{color:var(--accent)} .lens.op .dot{background:var(--accent)}
  .lens ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--space-2)}
  .lens li{font-size:var(--text-xs);line-height:1.55;color:var(--ink-2);padding-left:var(--space-3);position:relative}
  .lens li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--ink-4)}
  .lens.op li::before{background:var(--accent)}
  .resolve{padding:var(--space-3) var(--space-6);background:var(--accent-soft);border-top:1px solid var(--accent-edge);display:flex;gap:var(--space-3);align-items:baseline}
  .resolve .rl{font-size:var(--text-xs);letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--accent);flex-shrink:0}
  .resolve p{margin:0;font-size:var(--text-sm);line-height:1.6;color:var(--ink)}

  /* priority table */
  .ptable{width:100%;border-collapse:collapse;font-size:var(--text-sm);background:var(--paper);border:1px solid var(--edge);border-radius:var(--radius-lg);overflow:hidden}
  .ptable thead th{text-align:left;font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--edge);background:var(--paper-2)}
  .ptable td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--edge);vertical-align:top;line-height:1.5;color:var(--ink-2)}
  .ptable tr:last-child td{border-bottom:none}
  .ptable .mv{color:var(--ink);font-weight:500}
  .ptable .lens-tag{font-family:var(--font-mono);font-size:var(--text-xs);white-space:nowrap}
  .ptable .lens-tag.fr{color:oklch(0.52 0.13 60)} .ptable .lens-tag.gp{color:var(--ink-3)}
  .prio{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:var(--radius-full);font-weight:600;white-space:nowrap}
  .prio.now{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-edge)}
  .prio.next{background:var(--warning-soft);color:oklch(0.52 0.13 60);border:1px solid var(--warning-edge)}
  .prio.later{background:var(--paper-3);color:var(--ink-3);border:1px solid var(--edge)}

  .foot{margin-top:var(--space-16);border-top:1px solid var(--edge);padding-top:var(--space-4);display:flex;justify-content:space-between;gap:var(--space-6);font-size:var(--text-xs);color:var(--ink-3);flex-wrap:wrap}
  .foot .fk{font-family:var(--font-kanji);color:var(--accent)}

  #theme-tweak{position:fixed;top:14px;right:14px;z-index:99;display:inline-flex;align-items:center;gap:var(--space-2);
    padding:var(--space-2) var(--space-3);border-radius:var(--radius-full);cursor:pointer;background:var(--paper-2);color:var(--ink-2);
    border:1px solid var(--edge);font:500 var(--text-sm)/1.2 var(--font-ui,sans-serif);box-shadow:var(--shadow-sm)}
  #theme-tweak .kanji{font-size:var(--text-sm);color:var(--accent)}
  @media (max-width:900px){ .scorecard,.themes{grid-template-columns:1fr 1fr} .lenses{grid-template-columns:1fr} .lens{border-right:none;border-bottom:1px solid var(--edge)} }
</style>
</head>
<body class="sensei">
  <button id="theme-tweak" type="button"><span class="kanji">夜</span><span id="ttl">Dark mode</span></button>
  <div class="wrap" id="app"></div>

  <script>
  (function(){
    var KEY='sensei-dojo-theme',btn=document.getElementById('theme-tweak'),lab=document.getElementById('ttl');
    function apply(d){document.documentElement.setAttribute('data-theme',d?'dark':'light');btn.querySelector('.kanji').textContent=d?'昼':'夜';lab.textContent=d?'Light mode':'Dark mode';}
    var dark=localStorage.getItem(KEY)==='dark';apply(dark);
    btn.addEventListener('click',function(){dark=!dark;localStorage.setItem(KEY,dark?'dark':'light');apply(dark);});
  })();
  </script>

  <script>
  /* ── the journey · one persona, the daily round through the app ── */
  const PERSONA = "Rin Saito · maintainer at Acme (admin), lead at Globex — four dōjōs, five projects in flight.";

  const STAGES = [
    { n:"01", k:"入", seg:"Act I · the personal round", name:"Arrive", surf:"Sign in → Your work",
      health:"partial", conf:.58,
      does:"Rin signs in with GitHub and lands on <b>Your work</b> — a needs-you band, live runs, and active projects, all at once. No dōjō required; the org switcher waits in the top bar.",
      fr:["Sign-in offers GitHub and magic-link with equal weight — the primary path isn't obvious.","Three bands (needs-you · runs · projects) compete for the first glance; nothing says where to start."],
      gp:["Search in the top bar is decorative — no results surface.","No “what changed overnight” digest of runs that finished while away.","A project's dōjō and your role there aren't glanceable in the row."],
      op:["Lead with one next-best-action sentence in sensei's voice.","A quiet morning-briefing line above the bands.","Collapse runs that resolved cleanly into a single digest."],
      res:"Your work is a coordination surface, not the workbench — the session runs in Sensei on your machine. Order the bands by urgency and let sensei name the one thing worth doing, then hand off cleanly into the app." },

    { n:"02", k:"要", seg:"Act I · the personal round", name:"Triage what needs you", surf:"Needs-you band",
      health:"weak", conf:.46,
      does:"Four kinds of thing wait on Rin — a gate to approve, a conflict to settle, a decision to sign off, a second review. Each row names the kind and its age.",
      fr:["Rows route <b>away</b> to a relay surface to act — you can't approve a gate from the band itself.","Four distinct kinds share one row shape; the verb chip is the only differentiator."],
      gp:["No batch handling, snooze, or delegate-to-another-maintainer.","Age is shown but nothing escalates as it grows."],
      op:["Inline approve / deny right in the band for gates.","Group by dōjō or by urgency; keyboard-first triage.","A one-tap “ask another maintainer”."],
      res:"Approving here is <b>remote relay</b> — the gate itself fires in Sensei on the machine. Bring approve / deny inline so the web app is a fast remote control, not a routing menu; enforcement stays with the app." },

    { n:"03", k:"観", seg:"Act I · the personal round", name:"Watch & converse", surf:"Live runs · Chat",
      health:"partial", conf:.62,
      does:"Rin watches sessions in flight and drops into a chat thread where sensei speaks — rarely — to flag a guard or ask for one approval.",
      fr:["Runs and chat are separate nav items with no link between a run and its conversation.","“Gate waiting” on a run card duplicates the needs-you band."],
      gp:["No run timeline or diff preview; no pause / intervene.","“Session log” links nowhere — completed-run history is unbuilt."],
      op:["Make run → chat → gate one continuous surface.","An ambient “still listening” when the session is quiet."],
      res:"These runs live in Sensei; the web app mirrors them for away-from-keyboard oversight. Stitch run → chat → gate into one relay surface so remote intervention is continuous — the app still does the applying." },

    { n:"04", k:"解", seg:"Act I · the personal round", name:"Understand a project", surf:"Effective-constitution preview",
      health:"strong", conf:.82,
      does:"Before writing a line, Rin opens a project and sees exactly what governs it — the ladder broad→specific, a by-layer / consolidated toggle, and the conflicts the ladder discarded.",
      fr:["Discarded conflicts sit below the fold.","The consolidated list doesn't link a rule back to the scope that authored it."],
      gp:["No “simulate a session under these rules”.","No diff against the last time this constitution changed."],
      op:["Provenance on every effective rule — tap to jump to its authoring scope.","A “what changed since you last opened this” banner.","Leave “simulate a session under these rules” to Sensei, where rules actually apply."],
      res:"This is pure config — the resolved constitution the dōjō authored and Sensei will enforce. Make every rule traceable to its authoring scope; the dry-run of <em>application</em> belongs in Sensei, not here." },

    { n:"05", k:"掟", seg:"Act I · the personal round", name:"Govern yourself", surf:"Constitution · Rule packs",
      health:"weak", conf:.44,
      does:"Rin sets a stance (autonomy / sharing / review), reads their effective personal constitution, and adopts rule packs to seed it.",
      fr:["Personal constitution and rule packs are two separate doors to one idea — “my rules”.","Adopting a pack doesn't show which scope it lands in, or whether it conflicts."],
      gp:["No preview of a pack's rules before adopting.","No history or versioning of governance changes."],
      op:["One rules model with a scope filter, not three screens.","Pack adoption shows the target scope and runs a conflict check first."],
      res:"Your personal rules are config the app applies on your machine. Unify the doors into one scope-filtered model so “where does a rule come from, where will it land” is answerable <em>before</em> Sensei ever acts on it." },

    { n:"06", k:"共", seg:"Act I · the personal round", name:"Belong & contribute", surf:"My dōjōs · Contributions",
      health:"partial", conf:.60,
      does:"Rin reviews the dōjōs they belong to and tracks what they've shared upstream — approved, in triage, declined — plus what's been approved back down to them.",
      fr:["My dōjōs and Contributions are separate; sharing itself happens elsewhere, so this reads as passive tracking.","A declined contribution carries only a thin reason."],
      gp:["No share-from-here; no notification when a decision lands.","Credit on adoption isn't surfaced to the contributor."],
      op:["Contribute inline from where the lesson appears.","Decision notifications with a reason on decline and credit on adopt."],
      res:"Contribution is a coordination loop the dōjō owns; the lesson is captured in Sensei. Close the loop with decision notifications and credit — the web app's job is the hand-off and the outcome, not the capture." },

    { n:"07", k:"社", seg:"Act II · the dōjō path", name:"Step into a dōjō", surf:"Org switch → Org home",
      health:"partial", conf:.56,
      does:"Rin picks a dōjō from the switcher; the shell keeps its shape while nav and accent change, and the org home shows the projects in its jurisdiction.",
      fr:["The switcher is the only way in or out — no breadcrumb back to Your work.","Personal items (relay, packs) vanish in org context with no explanation."],
      gp:["No cross-context needs — you can't see “my needs” while inside one org.","Which of your own projects belong to this org isn't marked."],
      op:["Carry “needs you” into every context.","A context breadcrumb; role-scoped nav that explains what's hidden and why."],
      res:"Switching context changes what you <em>configure and coordinate</em> — never where rules apply, which is always Sensei. Carry needs-you across the wall and add a breadcrumb so the self stays continuous." },

    { n:"08", k:"組", seg:"Act II · the dōjō path", name:"Author governance", surf:"Constitution ladder · Scopes",
      health:"partial", conf:.50,
      does:"As maintainer, Rin authors the dōjō's own rules by scope — company · teams · stacks, packs per stack — and assigns who owns each scope's triage queue.",
      fr:["Authoring looks live — there's no draft / publish, though the review stance implies one.","Scope <b>ownership</b> and scope <b>rules</b> are two screens for one mental model."],
      gp:["No change history; no conflict check across scopes before a rule lands.","No way to simulate the impact of a new rule."],
      op:["Governance as a reviewed act: draft → review → publish.","Unify scope authoring and ownership; preview impact before publish."],
      res:"This is the dōjō's core job — authoring the config Sensei enforces on every machine. Honor the review stance with draft → review → publish, and unify scope rules + ownership so what ships is deliberate." },

    { n:"09", k:"任", seg:"Act II · the dōjō path", name:"Steward the dōjō", surf:"Members · Audit · Plan & billing",
      health:"partial", conf:.60,
      does:"As admin, Rin manages members and additive roles, reads the audit log, and oversees plan & billing — seats billed per active contributor.",
      fr:["Audit reuses chat data and reads thin — it isn't yet the trust surface it implies.","A role change has no impact preview; billing tiers aren't tied to what's actually active."],
      gp:["No invite flow; no confirmation that promoting a role grants governance.","Audit has no filter or export."],
      op:["Explain additive roles at the moment of change.","Audit as an exportable, immutable trust surface.","Billing shows what each seat unlocks."],
      res:"Stewardship is trust over the config and who may change it. Make audit an exportable trail and explain additive roles at the moment of change — the web app governs <em>who configures</em>; Sensei governs <em>what runs</em>." },
  ];

  const THEMES = [
    { k:"即", h:"Act where you are", p:"The web app is repeatedly a place you go to <em>route</em> rather than to act. It never applies rules itself — that's Sensei on the machine — but it <em>is</em> the remote control for relay: approve, decide, contribute should happen inline, right where the thing appears, not one screen away." },
    { k:"源", h:"Provenance & traceability", p:"Understanding a project is strong, but a rule's origin, a conflict's resolution, and “what changed since I last looked” are under-surfaced everywhere else. Make every rule traceable to the scope that authored it." },
    { k:"一", h:"One rules model, many doors", p:"Personal constitution, rule packs, org constitution and scopes are four surfaces for one idea. A scope-filtered single model would collapse the fragmentation and answer “where does this come from?” in one place." },
    { k:"続", h:"Context continuity", p:"The line between your work and a dōjō is a hard wall — needs-you and search don't cross it, and personal surfaces vanish without explanation. Carry the self across contexts with a breadcrumb and a persistent needs band." },
    { k:"検", h:"Governance as a reviewed act", p:"The review stance dial promises draft → review → publish, but authoring is immediate. Honoring that promise is what makes governance trustworthy — and closes the loop the stance already opened." },
    { k:"環", h:"Close every loop", p:"Contributions, decisions, and audit all leave the user waiting in silence. A decision notification, a credit on adoption, an exportable trail — small closures that keep people contributing." },
  ];

  const PRIORITY = [
    { m:"Inline gate approve / deny in the needs-you band", s:"02 Triage", lens:"fr", prio:"now" },
    { m:"Order the landing bands by urgency + a next-best-action line", s:"01 Arrive", lens:"fr", prio:"now" },
    { m:"Provenance link on every effective rule → its authoring scope", s:"04 Understand", lens:"gp", prio:"now" },
    { m:"Carry the needs-you band across personal ⇄ org contexts", s:"07 Step in", lens:"gp", prio:"now" },
    { m:"Unify constitution + rule packs into one scope-filtered model", s:"05 Govern", lens:"fr", prio:"next" },
    { m:"Draft → review → publish for governance authoring", s:"08 Author", lens:"gp", prio:"next" },
    { m:"Run → chat → gate as one continuous surface", s:"03 Watch", lens:"fr", prio:"next" },
    { m:"Decision notifications — reason on decline, credit on adopt", s:"06 Belong", lens:"gp", prio:"next" },
    { m:"Pack adoption shows target scope + conflict check", s:"05 Govern", lens:"gp", prio:"next" },
    { m:"“What changed since you last opened this” on project preview", s:"04 Understand", lens:"op", prio:"later" },
    { m:"Audit as an exportable, filterable trust surface", s:"09 Steward", lens:"gp", prio:"later" },
    { m:"Overnight run digest on the landing", s:"01 Arrive", lens:"op", prio:"later" },
  ];

  /* ── render ── */
  function esc(s){return s;}
  const app = document.getElementById('app');

  const counts = STAGES.reduce((a,s)=>{a[s.health]++;return a;},{strong:0,partial:0,weak:0});

  let html = '';
  // masthead
  html += `<div class="mast">
    <div class="lede">
      <div class="mk">巡</div>
      <div>
        <div class="eyebrow">先生 Sensei · Dōjō web app</div>
        <h1>The daily round —<br/>a journey through the app.</h1>
        <p>The work-first Dōjō app, walked end to end as one person's day: sign in, clear what needs you, understand a project, govern your rules, then step into a dōjō to author and steward its shared mind. Each stage is read through three lenses — friction, gaps, opportunities — with a resolution.</p>
      </div>
    </div>
    <div class="meta">
      <div><b>Scope</b> · Dōjō app (v0.4)</div>
      <div><b>Persona</b> · Rin Saito</div>
      <div><b>Lenses</b> · friction · gaps · opportunity</div>
      <div><b>Source</b> · wired flow · 15 screens</div>
    </div>
  </div>`;

  // scorecard
  html += `<div class="sec"><div class="sec-head"><span class="num">§1</span><h2>How the journey holds up</h2><span class="hint">nine stages · two acts</span></div>
    <div class="scorecard">
      <div class="score strong"><div class="n">${counts.strong}</div><div class="lab">Strong</div><div class="sub">clear, calm, does its job — understanding a project leads.</div></div>
      <div class="score partial"><div class="n">${counts.partial}</div><div class="lab">Partial</div><div class="sub">the surface is built; the loop or the in-place action is missing.</div></div>
      <div class="score weak"><div class="n">${counts.weak}</div><div class="lab">Needs work</div><div class="sub">triage and self-governance ask too much navigation to act.</div></div>
      <div class="score"><div class="n">12</div><div class="lab">Moves</div><div class="sub">prioritised now / next / later in §5.</div></div>
    </div></div>`;

  // emotion curve
  const CW=1000, pts = STAGES.map((s,i)=>({x:60+i*((CW-120)/(STAGES.length-1)), y:160-s.conf*150, s}));
  const line = pts.map(p=>`${p.x.toFixed(0)},${p.y.toFixed(0)}`).join(' ');
  const area = `60,160 ${line} ${pts[pts.length-1].x.toFixed(0)},160`;
  html += `<div class="curve"><svg viewBox="0 0 ${CW} 190" preserveAspectRatio="none">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.14"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${area}" fill="url(#cg)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<g>
      <circle cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="4.5" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/>
      <text class="cx" x="${p.x.toFixed(0)}" y="185" text-anchor="middle">${p.s.k}</text>
      <text class="cl" x="${p.x.toFixed(0)}" y="${(p.y-12).toFixed(0)}" text-anchor="middle">${p.s.name}</text>
      <text class="cv" x="${p.x.toFixed(0)}" y="${(p.y+18).toFixed(0)}" text-anchor="middle">${Math.round(p.s.conf*100)}</text>
    </g>`).join('')}
  </svg><div class="curve-cap">Confidence through the journey — it peaks understanding a project, dips at triage and self-governance where acting means navigating away.</div></div>`;

  // themes
  html += `<div class="sec"><div class="sec-head"><span class="num">§2</span><h2>What keeps recurring</h2><span class="hint">cross-cutting themes</span></div>
    <div class="themes">${THEMES.map(t=>`<div class="theme"><span class="tk">${t.k}</span><div><h3>${t.h}</h3><p>${t.p}</p></div></div>`).join('')}</div></div>`;

  // callout
  html += `<div class="callout"><span class="ck">即</span><div>
    <div class="eyebrow">The one move</div>
    <h3>The dōjō configures; Sensei applies.</h3>
    <p>The web app's clearest surface is the one where you <em>read</em> the config that governs a project. Its weakest are where you must <em>act</em> on it — triage, govern, contribute — because each routes you elsewhere. Keep the boundary sharp: the dōjō owns the rules and who may change them; applying them in a session is always Sensei on the machine. Within that lane, the one move is to let people act where they stand — inline relay approvals, contribute where the lesson forms, and carry “needs you” into every context.</p>
  </div></div>`;

  // stages
  html += `<div class="sec"><div class="sec-head"><span class="num">§3</span><h2>The journey, stage by stage</h2><span class="hint">friction · gaps · opportunity · resolution</span></div>`;
  let act='';
  STAGES.forEach(s=>{
    if(s.seg!==act){ act=s.seg; html+=`<div style="font-size:var(--text-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:var(--space-6) 0 var(--space-3)">${act}</div>`; }
    html += `<div class="stage">
      <div class="stage-head">
        <div class="sk">${s.k}</div>
        <div class="ttl"><div class="n">${s.n}</div><h4>${s.name}</h4><div class="surf">${s.surf}</div></div>
        <div class="hv"><div class="v">${Math.round(s.conf*100)}</div><div class="l">confidence</div></div>
        <span class="pill ${s.health}">${s.health==='strong'?'Strong':s.health==='weak'?'Needs work':'Partial'}</span>
      </div>
      <div class="does">${s.does}</div>
      <div class="lenses">
        <div class="lens fr"><div class="ll"><span class="dot"></span>Friction</div><ul>${s.fr.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="lens gp"><div class="ll"><span class="dot"></span>Gaps</div><ul>${s.gp.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="lens op"><div class="ll"><span class="dot"></span>Opportunities</div><ul>${s.op.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
      <div class="resolve"><span class="rl">Resolve</span><p>${s.res}</p></div>
    </div>`;
  });
  html += `</div>`;

  // priority
  html += `<div class="sec"><div class="sec-head"><span class="num">§5</span><h2>Where to move first</h2><span class="hint">now · next · later</span></div>
    <table class="ptable"><thead><tr><th>Move</th><th>Stage</th><th>Lens</th><th>Priority</th></tr></thead><tbody>
    ${PRIORITY.map(p=>`<tr><td class="mv">${p.m}</td><td>${p.s}</td><td class="lens-tag ${p.lens}">${p.lens==='fr'?'friction':p.lens==='gp'?'gap':'opportunity'}</td><td><span class="prio ${p.prio}">${p.prio}</span></td></tr>`).join('')}
    </tbody></table></div>`;

  // foot
  html += `<div class="foot"><span><span class="fk">先生</span> Sensei · Dōjō — journey audit</span><span>Read against the wired flow in <b>Sensei Dōjō App.html</b></span><span>v0.4 · 9 stages · 12 moves</span></div>`;

  app.innerHTML = html;
  </script>
</body>
</html>
