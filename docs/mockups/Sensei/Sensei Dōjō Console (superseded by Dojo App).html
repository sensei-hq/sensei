<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Sensei · Dōjō — console (site design)</title>
  <meta name="viewport" content="width=1600"/>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <script src="lib/unocss.js"></script>
  <link rel="stylesheet" href="fonts.css"/>
  <script>
    (function(){
      window.addEventListener('error', function(e){
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) { e.stopImmediatePropagation(); e.preventDefault(); }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const N = window.ResizeObserver;
      window.ResizeObserver = class extends N { constructor(cb){ super((en,ob)=>{ window.requestAnimationFrame(()=>{ try{cb(en,ob);}catch(e){ if(!String(e&&e.message).includes('ResizeObserver loop')) throw e; } }); }); } };
    })();
  </script>
  <style>
    html, body { margin:0; padding:0; height: 100%; background: var(--paper); font-family: 'Inter', system-ui, sans-serif; }
    #root { height: 100vh; }
    /* dark-mode tweak control */
    #theme-tweak {
      position: fixed; top: 14px; right: 14px; z-index: 9999;
      display: inline-flex; align-items: center; gap:var(--space-2);
      padding:var(--space-2) var(--space-3); border-radius: 999px; cursor: pointer;
      background: var(--paper-2); color: var(--ink-2);
      border: 1px solid var(--paper-edge);
      font: 500 var(--text-sm)/1.2 var(--font-ui);
      box-shadow: var(--shadow-sm);
    }
    #theme-tweak .kanji { font-size:var(--text-sm); color: var(--accent); }
  </style>
</head>
<body>
  <button id="theme-tweak" type="button" aria-pressed="false">
    <span class="kanji">夜</span><span id="theme-tweak-label">Dark mode</span>
  </button>
  <div id="root"></div>

  <script>
    (function(){
      const KEY = 'sensei-dojo-theme';
      const btn = document.getElementById('theme-tweak');
      const label = document.getElementById('theme-tweak-label');
      function apply(dark){
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        btn.setAttribute('aria-pressed', String(dark));
        btn.querySelector('.kanji').textContent = dark ? '昼' : '夜';
        label.textContent = dark ? 'Light mode' : 'Dark mode';
      }
      let dark = localStorage.getItem(KEY) === 'dark';
      apply(dark);
      btn.addEventListener('click', function(){
        dark = !dark;
        localStorage.setItem(KEY, dark ? 'dark' : 'light');
        apply(dark);
      });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="lib/shared/design-canvas.jsx"></script>
  <script type="text/babel" src="lib/shared/primitives.jsx"></script>
  <script src="lib/data/dojo-data.js"></script>
  <script src="lib/data/extensions-data.js"></script>
  <script type="text/babel" src="lib/dojo/dojo-shared.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-admin.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-governance.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-library.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-preview.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-identity.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-billing.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-maintainer.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-extensions.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-lead.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-developer.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-relay.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-saas.jsx"></script>
  <script type="text/babel" src="lib/dojo/dojo-flow.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const W = 1340, H = 940;

    function App() {
      return (
        <DesignCanvas initialZoom={0.5}>
          <DCSection id="flow-desktop"
                     title="Desktop flow — one wired app, every role"
                     subtitle="Not a pile of screens: one navigable experience. Sign in and you land on your Relay (the You zone — your projects, action items, tasks in flight). Click a Dōjō in the org switcher (top bar) to step into its management shell — the role is decided by your membership (Acme → admin · Globex → maintainer · Initech → lead), each with its own sidebar and a ← Your work exit. Open ‘Project rules’ for a project’s effective constitution. The boards below just drop you at different points of the same flow.">
            <DCArtboard id="dt-signin" label="★ Sign in → lands on your Relay" width={W} height={H}>
              <DojoDesktopFlow start="signin"/>
            </DCArtboard>
            <DCArtboard id="dt-home" label="★ Your home · Relay (the landing) — switch/enter a Dōjō from the top bar" width={W} height={H}>
              <DojoDesktopFlow start="you"/>
            </DCArtboard>
            <DCArtboard id="dt-admin" label="★ Stepped into a Dōjō · Admin (Acme) — own management shell" width={W} height={H}>
              <DojoDesktopFlow startDojo="acme"/>
            </DCArtboard>
            <DCArtboard id="dt-maintainer" label="Stepped into a Dōjō · Maintainer (Globex)" width={W} height={H}>
              <DojoDesktopFlow startDojo="globex"/>
            </DCArtboard>
            <DCArtboard id="dt-lead" label="Stepped into a Dōjō · Lead (Initech)" width={W} height={H}>
              <DojoDesktopFlow startDojo="initech"/>
            </DCArtboard>
            <DCArtboard id="dt-project" label="★ Project · effective constitution + your personal guardrails" width={W} height={H}>
              <DojoDesktopFlow start="project"/>
            </DCArtboard>
          </DCSection>

          <DCSection id="flow-mobile"
                     title="Mobile flow — one wired app"
                     subtitle="The same Relay, folded onto a phone. Bottom tabs (Projects · Inbox · Chat · More) move between surfaces; a project card drills into Watch with a back gesture; More carries the away-from-keyboard actions (approve · decide · session log) and the Dōjō switch. One navigable artboard — tap through it.">
            <DCArtboard id="mob-flow" label="★ Mobile flow · tap the tabs and cards" width={390} height={844}>
              <DojoMobileFlow/>
            </DCArtboard>
          </DCSection>

          <DCSection id="compare-landing"
                     title="Compare · landing options (reference, not in the flow)"
                     subtitle="Side by side so you can judge: the old standalone Relay-entry ‘solo home’ (bespoke ‘here’s what’s running’ summary) versus the current landing — the wired You shell opening on Relay Projects, with the rail. Pick which becomes the landing.">
            <DCArtboard id="cmp-old-solo" label="Option A · old standalone solo home (no rail)" width={W} height={H}>
              <DojoOrgsEmpty/>
            </DCArtboard>
            <DCArtboard id="cmp-new-relay" label="Option B · current landing · Relay in the You shell (with rail)" width={W} height={H}>
              <DojoDeveloperConsole initial="teams" relayStart="projects"/>
            </DCArtboard>
          </DCSection>

          <DCSection id="dojo-kanji-legend"
                     title="Kanji legend"
                     subtitle="Every functional kanji in the console, decoded. Kanji sit beside a text label in the UI — never as the sole marker of a state — so this is a reference, not a decoder ring.">
            <DCArtboard id="kanji-legend" label="Kanji marks · glossary" width={W} height={620}>
              <div className="sensei bg-paper" style={{ width: "100%", height: "100%", overflow: "auto" }}>
                <div className="p-8" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)" }}>
                  {[["結","Dōjō / team"],["社","Org / company"],["組","Team"],["件","Project"],["技","Stack / skill"],["己","Personal"],["群","Community / collective"],["客","Client"],
                    ["掟","Governance rules"],["問","Agents & personas"],["令","Commands"],["庫","Catalog / library"],["蔵","Knowledge"],["門","Triage"],["承","Second approval"],["検","Review gate"],
                    ["携","Relay"],["場","Projects"],["決","Decision / inbox"],["話","Chat"],["録","Session log / audit"],["観","Monitor / observe"],["盾","Anonymize / confidentiality"],["守","Guard"],
                    ["任","Members & roles"],["規","Scopes & policies"],["鍵","Identity / SSO"],["円","Plan & billing"],["迎","Onboarding / inherit"],["絶","Connection lost"],["了","Session ended"],["眠","Daemon asleep"]
                  ].map(([k, m]) => (
                    <div key={k} className="bg-paper-soft border-1px border-paper-edge gap-3 p-3" style={{ display: "flex", alignItems: "center", borderRadius: "var(--radius-lg)", margin:6 }}>
                      <span className="kanji text-2xl text-accent" style={{ width: 30, textAlign: "center", flexShrink: 0 }}>{k}</span>
                      <span className="text-sm text-ink">{m}</span>
                    </div>
                  ))}
                </div>
              </div>
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
