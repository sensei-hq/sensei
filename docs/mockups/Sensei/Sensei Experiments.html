  <script>
    // Swallow the benign ResizeObserver "loop completed" warning emitted by
    // the design canvas's pan-zoom logic. Two layers: wrap the RO callback in
    // rAF, and intercept the global error event the browser fires.
    (function() {
      window.addEventListener('error', function(e) {
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const NativeRO = window.ResizeObserver;
      window.ResizeObserver = class extends NativeRO {
        constructor(cb) {
          super((entries, observer) => {
            window.requestAnimationFrame(() => {
              try { cb(entries, observer); } catch (e) {
                if (!String(e && e.message).includes('ResizeObserver loop')) throw e;
              }
            });
          });
        }
      };
    })();
  </script>

  <script type="text/babel" data-presets="env,react">
    // Tweaks — dark/light mode
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light"
    }/*EDITMODE-END*/;

    const App = () => {
      const [editMode, setEditMode] = React.useState(false);
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

      // Apply theme to the document for tokens to cascade
      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', tweaks.theme);
      }, [tweaks.theme]);

      // Edit mode protocol
      React.useEffect(() => {
        const onMsg = (e) => {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode') setEditMode(true);
          if (d.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const setTweak = (k, v) => {
        const next = { ...tweaks, [k]: v };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      };

      return (
        <>

               ═════════════════════════════════════════════════════════════ */}

              </DCArtboard>
              <DCArtboard id="boot-simple-manual" label="BootstrapSimple · Homebrew missing" width={1280} height={860}>
                <div className="artboard-shell"><BootstrapSimple scenario="manual-mac-no-brew" onReady={()=>{}}/></div>
              </DCArtboard>
              <DCArtboard id="boot-simple-win"    label="BootstrapSimple · Windows winget" width={1280} height={860}>
                <div className="artboard-shell"><BootstrapSimple scenario="manual-windows" onReady={()=>{}}/></div>
              </DCArtboard>
            </DCSection>

            <DCSection id="discarded-bootstrap"
                       title="Discarded · old 6-gate Bootstrap"
                       subtitle="Original sequential health-check: Homebrew → Postgres → Ollama → sensei components → DB → daemon, each gate showing its own remedy panel. Replaced by the simpler one-door layout in Flow ① that resolves everything through a single Brewfile / winget manifest from sensei-hq/homebrew-tap.">

              </DCArtboard>
              <DCArtboard id="boot-old-green"  label="6-gate · all green" width={1280} height={860}>
                <div className="artboard-shell"><Bootstrap scenario="all-green" onReady={()=>{}}/></div>
              </DCArtboard>
              <DCArtboard id="boot-old-brew"   label="6-gate · Homebrew missing" width={1280} height={860}>
                <div className="artboard-shell"><Bootstrap scenario="missing-homebrew" onReady={()=>{}}/></div>
              </DCArtboard>
              <DCArtboard id="boot-old-db"     label="6-gate · DB couldn't be created" width={1280} height={860}>

            </DCSection>

            {/* ─── Assistants · capability tick options ──────────── */}

              <DCArtboard id="chips-live"   label="Live · light" width={480} height={700}>

              </DCArtboard>
              <DCArtboard id="splash-green"      label="★ ④ all green · foundation holds"       width={880} height={480}>
                <div className="artboard-shell"><SplashHealthCheck state="all-green"/></div>
              </DCArtboard>
            </DCSection>

            {/* ─── Discarded · website directions ───────────────── */}
            <DCSection id="discarded-website"
                       title="Discarded · website directions"
                       subtitle="Two of the three marketing-site explorations. Variant B (confident continuity) shipped and is the live page (Sensei.html); A and C are kept here for reference.">
              <DCArtboard id="site-variant-a" label="A · Same world as the app (discarded)" width={1280} height={3600}>
                <div className="variant-shell"><VariantA/></div>
              </DCArtboard>
              <DCArtboard id="site-variant-c" label="C · Marketing-forward (discarded)" width={1280} height={4400}>
                <div className="variant-shell"><VariantC/></div>
              </DCArtboard>
            </DCSection>
        </DesignCanvas>

          {editMode && (
            <div style={{
              position: 'fixed', right: 20, bottom: 20, zIndex: 999,
              background: 'var(--paper)', border: '1px solid var(--edge)',
              borderRadius: 'var(--radius-lg)', padding: 'var(--space-4)', width: 240,
              boxShadow: 'var(--shadow)',
              fontFamily: 'var(--font-ui)'
            }}>
              <div style={{ fontSize: 'var(--text-xs)', letterSpacing: 'var(--tracking-wide)', textTransform: 'uppercase',
                            color: 'var(--ink-3)', marginBottom: 'var(--space-3)', fontWeight: 500 }}>Tweaks</div>
              <div style={{ fontSize: 'var(--text-sm)', color: 'var(--ink-2)', marginBottom: 'var(--space-1)' }}>Theme</div>
              <div style={{ display: 'flex', gap: 4, padding: 3, background: 'var(--paper-3)',
                            borderRadius: 'var(--radius)' }}>
                {['light','dark'].map(t => (
                  <button key={t} onClick={() => setTweak('theme', t)}
                          style={{ flex: 1, padding: '6px 10px', fontSize: 'var(--text-sm)', border: 'none',
                                    borderRadius: 'var(--radius-sm)', background: tweaks.theme === t ? 'var(--paper)' : 'transparent',

                                    cursor: 'pointer' }}>
                    {t === 'light' ? '日 light' : '夜 dark'}
                  </button>
                ))}
              </div>
              <div style={{ fontSize: 'var(--text-xs)', color: 'var(--ink-3)', marginTop: 'var(--space-3)', lineHeight: 1.5 }}>
                All three directions share the token system. Switching recolours washi paper + sumi ink together.
              </div>
            </div>
          )}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
