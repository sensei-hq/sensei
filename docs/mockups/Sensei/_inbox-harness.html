<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Inbox harness</title>
  <meta name="viewport" content="width=device-width"/>
  <!-- Load Inter + JetBrains as a top-level stylesheet link — the nested @import in
       tokens.css intermittently fails to fetch Inter (Fraunces loads), so the preview
       fell back to system-ui and read thinner than the app's Inter. This forces the
       real typeface so the side-by-side compares Inter-to-Inter. -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block"/>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <link rel="stylesheet" href="fonts.css"/>
  <script>
    // Force Inter into document.fonts — the CSS @font-face for Inter fails to register
    // in this preview (Fraunces registers fine), so text fell back to system-ui and
    // read thinner than the app's real Inter. FontFace API + add() is reliable and
    // makes the side-by-side compare Inter-to-Inter.
    ['300', '400', '500', '600'].forEach((w) => {
      const f = new FontFace('Inter', "url('fonts/google/inter/files/inter-latin-" + w + "-normal.woff2')", { weight: w, style: 'normal', display: 'block' });
      f.load().then((ff) => document.fonts.add(ff)).catch(() => {});
    });
    const jb = new FontFace('JetBrains Mono', "url('fonts/google/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2')", { weight: '400', display: 'block' });
    jb.load().then((ff) => document.fonts.add(ff)).catch(() => {});
  </script>
  <style>
    html, body { margin:0; padding:0; height:100%; background: var(--paper); font-family: 'Inter', system-ui, sans-serif; }
    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="lib/shared/design-canvas.jsx"></script>
  <script type="text/babel" src="lib/shared/primitives.jsx"></script>
  <script src="lib/data/dojo2-data.js"></script>
  <script type="text/babel" src="lib/dojo2/dojo2-kit.jsx"></script>
  <script type="text/babel" src="lib/dojo2/dojo2-app.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    ReactDOM.createRoot(document.getElementById('root'))
      .render(React.createElement(window.DojoApp2, { start: 'you', label: 'Inbox' }));
  </script>
</body>
</html>
