<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Sensei · Dōjō — app (work-first)</title>
  <meta name="viewport" content="width=1600"/>
  <link rel="stylesheet" href="lib/tokens.css"/>
  <script src="lib/unocss.js"></script>
  <link rel="stylesheet" href="fonts.css"/>
  <script>
    (function(){
      window.addEventListener('error', function(e){
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) { e.stopImmediatePropagation(); e.preventDefault(); }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const N = window.ResizeObserver;
      window.ResizeObserver = class extends N { constructor(cb){ super((en,ob)=>{ window.requestAnimationFrame(()=>{ try{cb(en,ob);}catch(e){ if(!String(e&&e.message).includes('ResizeObserver loop')) throw e; } }); }); } };
    })();
  </script>
  <style>
    html, body { margin:0; padding:0; height:100%; background: var(--paper); font-family: 'Inter', system-ui, sans-serif; }
    #root { height: 100vh; }
    #theme-tweak {
      position: fixed; top: 14px; right: 14px; z-index: 9999;
      display: inline-flex; align-items: center; gap:var(--space-2);
      padding:var(--space-2) var(--space-3); border-radius: 999px; cursor: pointer;
      background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--paper-edge);
      font: 500 var(--text-sm)/1.2 var(--font-ui); box-shadow: var(--shadow-sm);
    }
    #theme-tweak .kanji { font-size:var(--text-sm); color: var(--accent); }
  </style>
</head>
<body>
  <button id="theme-tweak" type="button" aria-pressed="false"><span class="kanji">夜</span><span id="theme-tweak-label">Dark mode</span></button>
  <div id="root"></div>

  <script>
    (function(){
      const KEY = 'sensei-dojo-theme';
      const btn = document.getElementById('theme-tweak');
      const label = document.getElementById('theme-tweak-label');
      function apply(dark){
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        btn.setAttribute('aria-pressed', String(dark));
        btn.querySelector('.kanji').textContent = dark ? '昼' : '夜';
        label.textContent = dark ? 'Light mode' : 'Dark mode';
      }
      let dark = localStorage.getItem(KEY) === 'dark';
      apply(dark);
      btn.addEventListener('click', function(){ dark = !dark; localStorage.setItem(KEY, dark ? 'dark' : 'light'); apply(dark); });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="lib/shared/design-canvas.jsx"></script>
  <script type="text/babel" src="lib/shared/primitives.jsx"></script>
  <script src="lib/data/dojo2-data.js"></script>
  <script src="lib/data/dojo2-api.js"></script>
  <script type="text/babel" src="lib/dojo2/dojo2-kit.jsx"></script>
  <script type="text/babel" src="lib/dojo2/dojo2-app.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const D = window.DOJO2;
    const W = 1300, H = 880;
    const authProj = D.projects.find(p => p.id === "auth");
    const clientProj = D.projects.find(p => p.id === "globex");
    const A = window.DojoApp2, M = window.DojoApp2Mobile;

    function App() {
      return (
        <DesignCanvas initialZoom={0.42}>

          <DCSection id="flow" title="Wired flow — one app, work-first"
            subtitle="Sign in and you land on your Inbox — every in-flight session in one list, sorted by what waits on you. Approve, decide and chat are not surfaces; they are answered inside a session. The top-bar org switcher steps you into a dōjō's own context (nav + accent rule change; role decided by membership: Acme → admin · Globex → lead · Initech → maintainer). Click any project to preview which ladder levels built its constitution. The boards below drop you at fixed points of this same wired app.">
            <DCArtboard id="flow-desktop" label="★ Wired · desktop — sign in, then click the switcher, nav, and project rows" width={W} height={H}>
              <A label="Wired desktop" start="signin" />
            </DCArtboard>
            <DCArtboard id="flow-mobile" label="★ Wired · mobile — sign in, then tap the tabs and cards" width={390} height={844}>
              <M label="Wired mobile" start="signin" startTab="inbox" />
            </DCArtboard>
          </DCSection>

          <DCSection id="personal" title="Personal screens — the You context"
            subtitle="Your own surfaces, composed only from the kit. (1) the inbox — one row per in-flight session, needs-you first · (2) your constitution + rule packs · (3) a project's effective-constitution preview · (4) a session detail, where gates and decisions are answered in place.">
            <DCArtboard id="p-signin" label="0 · Sign in — lands on the inbox" width={W} height={H}><A label="Sign in" start="signin" /></DCArtboard>
            <DCArtboard id="p-inbox" label="1 · Inbox — every in-flight session, needs-you first" width={W} height={H}><A label="Inbox" startNav="inbox" /></DCArtboard>
            <DCArtboard id="p-projects" label="1b · Your projects (list)" width={W} height={H}><A label="Your projects" startNav="projects" /></DCArtboard>
            <DCArtboard id="p-dojos" label="1c · My dōjōs — register / view memberships" width={W} height={H}><A label="My dōjōs" startNav="dojos" /></DCArtboard>
            <DCArtboard id="p-contrib" label="1d · Contributions — shared upstream + approved for you" width={W} height={H}><A label="Contributions" startNav="contributions" /></DCArtboard>
            <DCArtboard id="p-constitution" label="2 · Your constitution · stance + effective rungs" width={W} height={H}><A label="Constitution" startNav="rules" /></DCArtboard>
            <DCArtboard id="p-packs" label="2b · Rule packs (adopt)" width={W} height={H}><A label="Rule packs" startNav="packs" /></DCArtboard>
            <DCArtboard id="p-preview" label="3 · Project preview · company (lumen-auth)" width={W} height={H}><A label="Preview company" startNav="projects" startProject={authProj} /></DCArtboard>
            <DCArtboard id="p-preview-client" label="3b · Project preview · client (globex-portal) — client rung on" width={W} height={H}><A label="Preview client" startNav="projects" startProject={clientProj} /></DCArtboard>
            <DCArtboard id="p-run-gate" label="4 · Session detail — plan graph + the gate answered in place" width={W} height={H}><A label="Session · gate" startNav="inbox" startRun="s-2891" /></DCArtboard>
            <DCArtboard id="p-run-decide" label="4a · Session detail — a rule decision, answered in the session" width={W} height={H}><A label="Session · decide" startNav="inbox" startRun="s-2884" /></DCArtboard>
            <DCArtboard id="p-run-stalled" label="4b · Session detail — stalled, no heartbeat" width={W} height={H}><A label="Session · stalled" startNav="inbox" startRun="s-2882" /></DCArtboard>
          </DCSection>

          <DCSection id="org" title="Org screens — /org/[slug]"
            subtitle="Step into a dōjō and the shell keeps its shape; nav + accent rule change. The rail is six destinations at most — Home · Constitution · Projects, then one per zone of responsibility: Governance · Clients · Admin (role-gated, additive). Everything that used to be its own rail item is a tab inside its zone, so nesting stops at one level. The boards below deep-link straight to a tab.">
            <DCArtboard id="o-home" label="5 · Org home · Acme (admin)" width={W} height={H}><A label="Org home" start="acme" startNav="home" /></DCArtboard>
            <DCArtboard id="o-ladder" label="6 · Constitution ladder · author per scope" width={W} height={H}><A label="Org ladder" start="acme" startNav="ladder" /></DCArtboard>
            <DCArtboard id="o-preview" label="7 · Project → effective constitution" width={W} height={H}><A label="Org preview" start="acme" startNav="projects" startProject={authProj} /></DCArtboard>
            <DCArtboard id="o-teams" label="T1 · Teams — collective metrics, one row per team" width={W} height={H}><A label="Teams" start="acme" startNav="teams" /></DCArtboard>
            <DCArtboard id="o-team" label="T2 · Team detail — metrics · by developer · shared memory · inflow" width={W} height={H}><A label="Team" start="acme" startNav="teams" startTeam="payments" /></DCArtboard>
            <DCArtboard id="o-person" label="T3 · Developer drill-down — counts, never transcripts" width={W} height={H}><A label="Developer" start="acme" startNav="teams" startTeam="payments" startPerson="Aiko Nakamura" /></DCArtboard>
            <DCArtboard id="o-inflow" label="T4 · Inflow — what each local sensei sends up" width={W} height={H}><A label="Inflow" start="acme" startNav="teams" startTeamTab="inflow" /></DCArtboard>
            <DCArtboard id="o-members" label="8 · Role surfaces · members/roles/policies (admin)" width={W} height={H}><A label="Members" start="acme" startNav="members" /></DCArtboard>
            <DCArtboard id="o-triage" label="G1 · Triage (maintainer) — candidate queue + detail" width={W} height={H}><A label="Triage" start="acme" startNav="triage" /></DCArtboard>
            <DCArtboard id="o-approvals" label="G2 · Approvals (maintainer) — second sign-off" width={W} height={H}><A label="Approvals" start="acme" startNav="approvals" /></DCArtboard>
            <DCArtboard id="o-knowledge" label="G3 · Knowledge + catalog (maintainer)" width={W} height={H}><A label="Knowledge" start="acme" startNav="knowledge" /></DCArtboard>
            <DCArtboard id="o-engagements" label="C1 · Engagements (lead) — client confidentiality" width={W} height={H}><A label="Engagements" start="globex" startNav="engagements" /></DCArtboard>
            <DCArtboard id="o-incidents" label="C2 · Incidents (lead)" width={W} height={H}><A label="Incidents" start="globex" startNav="incidents" /></DCArtboard>
            <DCArtboard id="o-clientaudit" label="C3 · Client audit trail (lead)" width={W} height={H}><A label="Client audit" start="globex" startNav="clientaudit" /></DCArtboard>
            <DCArtboard id="o-identity" label="A1 · Identity & SSO (admin)" width={W} height={H}><A label="Identity" start="acme" startNav="identity" /></DCArtboard>
            <DCArtboard id="o-health" label="A2 · Health / Monitor (admin)" width={W} height={H}><A label="Health" start="acme" startNav="health" /></DCArtboard>
            <DCArtboard id="o-scopes" label="8d · Scopes & policies — who owns each queue" width={W} height={H}><A label="Scopes" start="acme" startNav="scopes" /></DCArtboard>
            <DCArtboard id="o-billing" label="8e · Plan & billing — seats, tiers, invoices" width={W} height={H}><A label="Billing" start="acme" startNav="billing" /></DCArtboard>
            <DCArtboard id="o-lead" label="8b · Lead context · Globex (client)" width={W} height={H}><A label="Lead" start="globex" startNav="home" /></DCArtboard>
            <DCArtboard id="o-maint" label="8c · Maintainer context · Initech" width={W} height={H}><A label="Maintainer" start="initech" startNav="ladder" /></DCArtboard>
          </DCSection>

          <DCSection id="mobile" title="Mobile — both planes, every context"
            subtitle="The same screens folded onto a phone; bottom tabs move between surfaces, a project card drills into the preview with a back gesture.">
            <DCArtboard id="m-inbox" label="Inbox — needs-you first" width={390} height={844}><M label="m · inbox" startTab="inbox" /></DCArtboard>
            <DCArtboard id="m-run" label="Session detail — gate answered in place" width={390} height={844}><M label="m · session" startTab="inbox" startRun="s-2891" /></DCArtboard>
            <DCArtboard id="m-projects" label="Your projects" width={390} height={844}><M label="m · projects" startTab="projects" /></DCArtboard>
            <DCArtboard id="m-teams" label="Teams — collective, stacked" width={390} height={844}><M label="m · teams" start="acme" startTab="teams" /></DCArtboard>
            <DCArtboard id="m-team" label="Team detail · Payments" width={390} height={844}><M label="m · team" start="acme" startTab="teams" startTeam="payments" /></DCArtboard>
            <DCArtboard id="m-org" label="Org home · Acme" width={390} height={844}><M label="m · org" start="acme" startTab="home" /></DCArtboard>
            <DCArtboard id="m-ladder" label="Org · constitution ladder" width={390} height={844}><M label="m · ladder" start="acme" startTab="ladder" /></DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
