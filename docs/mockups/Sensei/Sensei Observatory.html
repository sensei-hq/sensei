  <script>
    // Swallow the benign ResizeObserver "loop completed" warning emitted by
    // the design canvas's pan-zoom logic. Two layers: wrap the RO callback in
    // rAF, and intercept the global error event the browser fires.
    (function() {
      window.addEventListener('error', function(e) {
        if (e && e.message && String(e.message).includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      if (typeof window.ResizeObserver === 'undefined') return;
      const NativeRO = window.ResizeObserver;
      window.ResizeObserver = class extends NativeRO {
        constructor(cb) {
          super((entries, observer) => {
            window.requestAnimationFrame(() => {
              try { cb(entries, observer); } catch (e) {
                if (!String(e && e.message).includes('ResizeObserver loop')) throw e;
              }
            });
          });
        }
      };
    })();
  </script>

  <script type="text/babel" data-presets="env,react">
    // Tweaks — dark/light mode
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark"
    }/*EDITMODE-END*/;

    const App = () => {
      const [editMode, setEditMode] = React.useState(false);
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

      // Apply theme to the document for tokens to cascade
      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', tweaks.theme);
      }, [tweaks.theme]);

      // Edit mode protocol
      React.useEffect(() => {
        const onMsg = (e) => {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode') setEditMode(true);
          if (d.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const setTweak = (k, v) => {
        const next = { ...tweaks, [k]: v };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      };

      return (
        <>
          <DesignCanvas initialZoom={0.5}>
            {/* ═════════════════════════════════════════════════════════════
                ★ TOP-LEVEL FLOWS · the four user journeys
               ═════════════════════════════════════════════════════════════ */}

            {/* ═════════ FLOW 1 · BOOTSTRAP ═════════ */}
            <DCSection id="bootstrap"
                       title="① Bootstrap"
                       subtitle="Runs on every startup. The platform package manager (Homebrew on Mac/Linux, winget on Windows) is the single visible gate — everything else (Postgres · Ollama · sensei components · DB · daemon) is resolved by running a single Brewfile / winget manifest from sensei-hq/homebrew-tap. Each gate now explains what it is for and what happens if it is missing (the old 'no why' gap), with a framing card in the probe's left column. Minimal when green, expands into a two-column layout when there's work to do or report.">
              <DCArtboard id="boot-probing"
                          label="① Probing · initial detect"
                          width={1280} height={860}>
                <div className="artboard-shell"><SplashOnDesktop state="probing"/></div>
              </DCArtboard>
              <DCArtboard id="boot-fixing"
                          label="② Auto-fixing · running Brewfile"
                          width={1280} height={860}>
                <div className="artboard-shell"><SplashOnDesktop state="auto-fixing"/></div>
              </DCArtboard>
              <DCArtboard id="boot-manual"
                          label="③ Manual fallback · Homebrew missing, script provided"
                          width={1280} height={860}>
                <div className="artboard-shell"><SplashOnDesktop state="manual"/></div>
              </DCArtboard>
              <DCArtboard id="boot-green"
                          label="★ ④ All green · foundation holds"
                          width={1280} height={860}>
                <div className="artboard-shell"><SplashOnDesktop state="all-green"/></div>
              </DCArtboard>
            </DCSection>

            {/* ═════════ FLOW 2 · FIRST RUN ═════════ */}
            <DCSection id="setup"
                       title="② First run"
                       subtitle="Day 1 is just the scan. Bootstrap has already confirmed the foundation; here sensei finds your projects and lands on Projects (not an empty Today). Everything else — libraries, instruments, inference, assignments, profile — starts on sensible defaults you revisit in Preferences. The scan is reachable two ways: here on first load, and from Preferences when changes are needed.">
              <DCArtboard id="first-run"  label="★ First run · scan only → opens Projects" width={1280} height={820}>
                <div className="artboard-shell"><FirstRunApp/></div>
              </DCArtboard>
              <DCArtboard id="preferences" label="Preferences · scan first, free navigation (replaces the 9-stage wizard)" width={1280} height={820}>
                <div className="artboard-shell"><SetupWizard mode="preferences" onExit={()=>{}} onDone={()=>{}}/></div>
              </DCArtboard>
            </DCSection>

            {/* ═════════ FLOW 3 · OBSERVATORY · COLLECTIVE ═════════ */}
            <DCSection id="observatory-collective"
                       title="③ Observatory · Collective"
                       subtitle="The collective window. Today + Projects + Sessions + Logs + Insights + Memories + Upgrades + Impact + Libraries + Instruments + Collective intel + Configure. Click any project in Active projects (or in the Projects index) to open the Project window.">
              <DCArtboard id="coll-main"  label="★ Mature state · click any project in the sidebar to open it" width={1280} height={860}>
                <div className="artboard-shell"><ObservatoryDailyApp/></div>
              </DCArtboard>
              <DCArtboard id="coll-entry" label="First entry from first-run · welcome toast · lands on Projects with the guided first-session panel" width={1280} height={860}>
                <div className="artboard-shell"><ObservatoryEntryApp/></div>
              </DCArtboard>
              <DCArtboard id="coll-early" label="Early state · still listening · guided first session leads Projects (0/3 to first lesson)" width={1280} height={860}>
                <div className="artboard-shell"><ObservatoryEarlyApp/></div>
              </DCArtboard>
            </DCSection>

            {/* ═════════ FLOW 4 · OBSERVATORY · PROJECT ═════════ */}
            <DCSection id="observatory-project"
                       title="④ Observatory · Project"
                       subtitle="The project window opens as its own perspective when a project is clicked from the Collective. Project-scoped sidebar · Overview · Sessions · Memories · Traceability · Libraries · Instruments · Patterns · Impact · Settings.">
              <DCArtboard id="proj-sidebar" label="★ Project window · sidebar + Overview" width={1280} height={860}>
                <div className="artboard-shell"><ProjectPageSidebar/></div>
              </DCArtboard>
              <DCArtboard id="psplit-a" label="A · After launch · two windows side by side" width={1480} height={780}>
                <div className="artboard-shell"><PerspectiveSplitA/></div>
              </DCArtboard>
              <DCArtboard id="psplit-b" label="B · Project window standalone" width={1280} height={780}>
                <div className="artboard-shell"><PerspectiveSplitB/></div>
              </DCArtboard>
              <DCArtboard id="proj-atlas" label="Atlas · code graph · repos → packages → modules → symbols + docs layer" width={1280} height={820}>
                <div className="artboard-shell"><ProjectAtlasWindow/></div>
              </DCArtboard>
              <DCArtboard id="psplit-c" label="C · The launch moment · cascaded over collective" width={1480} height={860}>
                <div className="artboard-shell"><PerspectiveSplitC/></div>
              </DCArtboard>
            </DCSection>
        </DesignCanvas>

          {editMode && (
            <div style={{
              position: 'fixed', right: 20, bottom: 20, zIndex: 999,
              background: 'var(--paper)', border: '1px solid var(--edge)',
              borderRadius: 'var(--radius-lg)', padding: 'var(--space-4)', width: 240,
              boxShadow: 'var(--shadow)',
              fontFamily: 'var(--font-ui)'
            }}>
              <div style={{ fontSize: 'var(--text-xs)', letterSpacing: 'var(--tracking-wide)', textTransform: 'uppercase',
                            color: 'var(--ink-3)', marginBottom: 'var(--space-3)', fontWeight: 500 }}>Tweaks</div>
              <div style={{ fontSize: 'var(--text-sm)', color: 'var(--ink-2)', marginBottom: 'var(--space-1)' }}>Theme</div>
              <div style={{ display: 'flex', gap: 4, padding: 3, background: 'var(--paper-3)',
                            borderRadius: 'var(--radius)' }}>
                {['light','dark'].map(t => (
                  <button key={t} onClick={() => setTweak('theme', t)}
                          style={{ flex: 1, padding: '6px 10px', fontSize: 'var(--text-sm)', border: 'none',
                                    borderRadius: 'var(--radius-sm)', background: tweaks.theme === t ? 'var(--paper)' : 'transparent',
                                    color: tweaks.theme === t ? 'var(--ink)' : 'var(--ink-3)',
                                    cursor: 'pointer' }}>
                    {t === 'light' ? '日 light' : '夜 dark'}
                  </button>
                ))}
              </div>
              <div style={{ fontSize: 'var(--text-xs)', color: 'var(--ink-3)', marginTop: 'var(--space-3)', lineHeight: 1.5 }}>
                All three directions share the token system. Switching recolours washi paper + sumi ink together.
              </div>
            </div>
          )}
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
