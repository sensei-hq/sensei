<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#E8552B" />
		%sveltekit.head%
		<script>
			// #329: a magic-link landing carries the new session in the fragment, which
			// the server never sees. Hide the page until the root layout has synced it
			// (src/lib/auth-landing.ts); the pattern below is AUTH_LANDING_FRAGMENT.
			if (/(^#|&)access_token=/.test(location.hash)) document.documentElement.setAttribute('data-auth-pending', '');
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" data-mode="light" data-style="zen-sumi" data-density="comfortable">
		<script>
			(function () {
				try {
					var t = JSON.parse(localStorage.getItem('sensei-dojo-theme') || '{}');
					var b = document.body;
					b.dataset.mode = t.mode || 'light';
					if (t.style) b.dataset.style = t.style;
					if (t.density) b.dataset.density = t.density;
				} catch (e) {}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
