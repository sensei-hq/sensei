# Qlty configuration for the standalone sensei-hq/marketplace repository.
#
# This repo is published as a git subtree from the sensei monorepo
# (marketplace/ → sensei-hq/marketplace). Because Qlty Cloud analyses this
# repo on its own, it cannot see the monorepo's root .qlty/qlty.toml — without
# this file it falls back to auto-detected defaults, which surfaced findings
# that never appeared under the monorepo's curated config. This mirrors the
# relevant subset of that config (shell + workflows + secrets/deps); Rust
# (clippy) and Ruby (rubocop) plugins are omitted because this repo has no such
# sources.
#
# For a guide to configuration, visit https://qlty.sh/d/config
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
# Pinned so local CLI and Qlty Cloud run the same zizmor — an unpinned/older
# local zizmor missed audits (e.g. artipacked) that Cloud's newer one emitted.
version = "1.29.0"
