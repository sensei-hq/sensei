<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/favicon/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon/favicon-16x16.png" />
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<meta name="theme-color" content="#E8552B" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-mode="light" data-style="zen-sumi" data-density="comfortable">
		<script>
			(function () {
				try {
					var t = JSON.parse(localStorage.getItem('sensei-site-theme') || '{}')
					var b = document.body
					b.dataset.mode = t.mode || 'light'
					b.dataset.style = t.style || 'zen-sumi'
					if (t.density) b.dataset.density = t.density
				} catch (e) {}
			})()
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
