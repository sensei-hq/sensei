project:
  name: sensei-hive
  note: Hive-mind shared-brain schema — the hive-scoped subset of the sensei DDL tree.
source:
  dialect: postgresql
target:
  postgres:
    url: $DATABASE_URL
    extensions: []
schemas:
  - extensions
  - sensei
  - hive
scopes:
  hive:
    includes:
      - hive.shared_rules
      - hive.members
      - hive.api_keys
      - hive.audit_log
      - sensei.namespaces
      - sensei.scopes
      - sensei.enforcement
    deps: report
ignore: []
