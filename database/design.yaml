project:
  name: sensei
  note: Database structure for sensei the app.
source:
  dialect: postgresql
target:
  postgres:
    url: $DATABASE_URL
    extensions:
      - name: uuid-ossp
        schema: extensions
      - name: vector
        schema: extensions
schemas:
  - extensions
  - staging
  - sensei
  - history
  - inference
  - gateway
  - export
# Governance + artifact federation (Dōjō): the `dojo` schema lives in this one DDL
# tree but is selectively applied. `sensei-dojo` deploys the `dojo` scope — BOTH the
# governance-federation tables (shared_rules/members/api_keys/audit_log, formerly the
# `hive` schema) AND the SaaS-layer artifact tables — plus the shared governance
# closure (sensei.namespaces → sensei.scopes) and the sensei.enforcement enum, and NO
# extensions (its embedded Postgres has no pgvector). The daemon deploys the `default`
# scope: everything except the `dojo` service schema, with all extensions (vector).
scopes:
  dojo:
    # deps:include pulls FK-referenced tables (dojo.shared_rules → sensei.namespaces →
    # sensei.scopes) automatically; ENUMs used as column *types* are not FKs, so dbd's
    # closure can't reach them — include each explicitly (enforcement on shared_rules;
    # namespace_visibility on sensei.namespaces, read by dojo.seats billing). dojo.* lives
    # in the Dōjō service's own Postgres — a separate logical DB from the daemon's `sensei`
    # DB. The only sensei-side link is sensei.projects.dojo_id, a plain uuid (no cross-DB FK).
    #
    # Rule packs (D-LOCAL-PACKS) live in the `sensei` schema and deploy to BOTH planes:
    # the local daemon DB gets them free (default scope, sensei not excluded); Supabase
    # gets them here — but nothing in the `dojo` schema references them anymore (they left
    # dojo), so deps:include can't reach them → list them explicitly (the two enums are
    # column types too).
    #
    # Governance scopes (sensei.scopes) seed the constitution ladder and gate
    # seed_default_constitution (it skips unless the 'general' scope exists). The
    # dojo DB gets the sensei.scopes TABLE free via deps (dojo.shared_rules →
    # sensei.namespaces → sensei.scopes), but not its DATA: scopes load through the
    # staging import path, which the daemon's default scope owns. Pull just the
    # scopes staging table + its import proc (both reference only staging.scopes →
    # sensei.scopes — no FK deps, so no other staging tables come with them) so
    # `dbd deploy/import --scope dojo` seeds sensei.scopes here too, declaratively —
    # never a hand-rolled INSERT that would drift on the next reset+deploy.
    includes:
      - dojo
      - sensei.enforcement
      - sensei.namespace_visibility
      - sensei.rule_pack_area
      - sensei.rule_check
      # Column-type enums on sensei.rule_packs. dbd's dependency closure follows
      # FKs, and an enum used as a column type is not one — so like the enums
      # above, these must be listed explicitly or the dojo deploy fails with
      # `type "entity_origin" does not exist`.
      - sensei.entity_scope
      - sensei.entity_origin
      - sensei.rule_packs
      - sensei.rule_pack_rules
      - sensei.rule_pack_adoptions
      - sensei.seed_ponytail_pack
      - sensei.seed_default_constitution
      - staging.scopes
      - staging.import_scopes
      # Global rule-pack LIBRARY seed (staging-file model, like scopes): the staging
      # tables + import procs land the curated library packs (owner_namespace_id NULL,
      # library-only — never adopted) into sensei.rule_packs/rule_pack_rules on
      # `deploy/import --scope dojo`. Timestamp-guarded → incremental, not a reload.
      - staging.rule_packs
      - staging.rule_pack_rules
      - staging.import_rule_packs
      - staging.import_rule_pack_rules
    deps: include
    extensions: []      # vector-free: the embedded Dōjō PG lacks pgvector
  default:
    # The daemon's scope: everything EXCEPT the `dojo` service schema (which only
    # `sensei-dojo` materializes, in its own Postgres). The daemon-local mirror tables
    # (sensei.dojo_memberships/outbox/inbox) live in the `sensei` schema, so they stay
    # in this scope.
    excludes: [dojo]
    deps: include
import:
  staging:
    - staging
  options:
    truncate: true
    null_value: ""
ignore: []
