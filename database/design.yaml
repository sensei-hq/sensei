project:
  name: sensei
  note: Database structure for sensei the app.
source:
  dialect: postgresql
target:
  postgres:
    url: $DATABASE_URL
    extensions:
      - name: uuid-ossp
        schema: extensions
      - name: vector
        schema: extensions
schemas:
  - extensions
  - staging
  - sensei
  - history
  - inference
  - gateway
  - export
# Governance federation (issue #25): the `hive` schema lives in this one DDL tree
# but is selectively applied. `sensei-hive` deploys the `hive` scope (its tables +
# the shared governance closure, and NO extensions — its embedded Postgres has no
# pgvector). The daemon deploys the `default` scope: everything except the hive
# schema, with all extensions (vector) as before.
scopes:
  hive:
    # deps:include pulls FK-referenced tables (sensei.namespaces → sensei.scopes)
    # automatically; the enforcement ENUM is a column *type*, not an FK, so dbd's
    # closure can't reach it — include it explicitly.
    includes: [hive, sensei.enforcement]
    deps: include
    extensions: []      # vector-free: the embedded hive PG lacks pgvector
  dojo:
    # The Dōjō SaaS layer (issue: Dōjō track, Fork 1). dojo.* lives in the
    # Dōjō Rust service's own Postgres — a separate logical DB from the daemon's
    # `sensei` DB and from `hive`. Self-contained: every FK stays inside the dojo
    # schema (no cross-schema refs), so no `deps` closure reaches out. The only
    # sensei-side link is sensei.projects.dojo_id, a plain uuid (no cross-DB FK).
    includes: [dojo]
    deps: include
    extensions: []      # vector-free service DB, like hive
  default:
    excludes: [hive, dojo]
    deps: include
import:
  staging:
    - staging
  options:
    truncate: true
    null_value: ""
ignore: []
