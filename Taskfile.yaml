version: '3'

dotenv: ['.env']

vars:
  # Same dbd release the daemon links (dbd-core in crates/bootstrap/Cargo.toml).
  DBD_TAG:
    sh: grep -oP 'dbd-core = \{.*tag = "\K[^"]+' crates/bootstrap/Cargo.toml
  DATABASE_URL: 'postgresql://{{.PGUSER}}{{if .PGPASSWORD}}:{{.PGPASSWORD}}{{end}}@{{.PGHOST}}:{{.PGPORT}}/{{.PGDATABASE}}'

tasks:
  db:setup:
    desc: Deploy the sensei schema from database/ into the local Postgres (idempotent)
    cmds:
      - dbd deploy --source {{.ROOT_DIR}}/database -d {{.DATABASE_URL}}

  cli:install:
    desc: Build senseid, sensei and sensei-mcp (debug) and symlink them into ~/.local/bin
    cmds:
      - cargo build -p senseid -p sensei-cli -p sensei-mcp
      - mkdir -p ~/.local/bin
      - for: [senseid, sensei, sensei-mcp]
        cmd: ln -sf {{.ROOT_DIR}}/target/debug/{{.ITEM}} ~/.local/bin/{{.ITEM}}

  cli:
    desc: 'Run the sensei CLI from source (usage: task cli -- status)'
    cmds:
      - cargo run -q -p sensei-cli -- {{.CLI_ARGS}}

  # ── Local Dōjō (supabase/config.toml) ─────────────────────────────────────
  # Studio http://127.0.0.1:54323 · Mail (magic links) http://127.0.0.1:54324
  # Point the daemon here with DOJO_URL=http://localhost:5175 (the `dojo` process in process-compose.yaml).

  dojo:up:
    desc: Start the local Supabase stack (Docker) and deploy the dojo schema into it
    cmds:
      # config.toml exposes the `dojo` schema over the REST API, and that schema
      # only exists after dbd deploys it — so on a fresh stack the REST health
      # check cannot pass until after the deploy below.
      - supabase start --ignore-health-check
      - task: dojo:db:deploy

  dojo:down:
    desc: Stop the local Supabase stack (data is kept)
    cmds:
      - supabase stop

  dojo:reset:
    desc: Wipe the local Supabase DB, re-run supabase/seed.sql, and redeploy the dojo schema
    cmds:
      - supabase db reset
      - task: dojo:db:deploy

  dojo:db:deploy:
    desc: Deploy the `dojo` scope from database/ into the local Supabase Postgres
    dir: database
    cmds:
      - dbd deploy --scope dojo -e dev -d postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Make PostgREST serve the freshly deployed schema. A reload NOTIFY is not
      # enough while it sits in reconnect backoff from a missing `dojo` schema.
      # Name = supabase_rest_<project_id>.
      - docker restart supabase_rest_sensei-dojo

  dojo:env:
    desc: Write dojo/.env from the running local Supabase (skipped if dojo/.env exists)
    status:
      - test -f dojo/.env
    cmds:
      - |
        eval "$(supabase status -o env)"
        {
          echo "# Generated by 'task dojo:env' from the LOCAL Supabase stack. Local-only keys."
          echo "PUBLIC_SUPABASE_URL=$API_URL"
          echo "PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
        } > dojo/.env

  fresh:
    desc: Reset everything to start fresh (reference only)
    cmds:
      - dropdb --if-exists --force "$PGDATABASE"
      - createdb sensei
      - sudo rm -rf ~/.sensei/
      - task: db:setup
      - task: dojo:up
      - task: dojo:reset